  AC = new (window.AudioContext || window.webkitAudioContext)();
} catch (_) {
  AC = null;
}

function tone(f, type, dur, vol, t0) {
  if (!AC) return;
  try {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g);
    g.connect(AC.destination);
    o.type = type;
    o.frequency.value = f;
    const s = AC.currentTime + (t0 || 0);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    o.start(s);
    o.stop(s + dur + 0.02);
  } catch (_) {}
}

// ============================================
// PARTICLES
// ============================================
let parts = [];

function spawnP(x, y, col, n, label) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i + Math.random() * 0.6;
    const sp = 2 + Math.random() * 4;
    parts.push({
      x,
      y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 2,
      life: 1,
      dec: 0.02 + Math.random() * 0.018,
      col,
      r: 4 + Math.random() * 5,
      label: i === 0 ? (label || '') : ''
    });
  }
}

function tickP() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.dec;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

function drawP() {
  parts.forEach((p) => {
    ctx.save();
    ctx.globalAlpha = p.life;
    if (p.label) {
      ctx.fillStyle = p.col;
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x, p.y);
    } else {
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

// HELPERS
// ============================================
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rnd(a, b) { return a + Math.random() * (b - a); }

function shadeHex(hex, amt) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = clamp(r + amt, 0, 255);
  g = clamp(g + amt, 0, 255);
  b = clamp(b + amt, 0, 255);
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function drawStarShape(x, y, r1, r2, pts) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = i * Math.PI / pts - Math.PI / 2;
    const r = i % 2 === 0 ? r1 : r2;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
}

function drawSegmentedBar(x, y, width, height, value, max) {
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(x, y, width, height);
  const gap = 2;
  const segments = max;
  const segWidth = (width - gap * (segments + 1)) / segments;
  const safeValue = clamp(value, 0, max);

  for (let i = 0; i < segments; i++) {
    const fill = clamp(safeValue - i, 0, 1);
    ctx.fillStyle = '#222';
    ctx.fillRect(x + gap + i * (segWidth + gap), y + gap, segWidth, height - gap * 2);

    if (fill > 0) {
      ctx.fillStyle = safeValue > 5 ? '#4CAF50' : safeValue > 2 ? '#FF9800' : '#F44336';
      ctx.fillRect(x + gap + i * (segWidth + gap), y + gap, segWidth * fill, height - gap * 2);
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, width, height);
}

function roundRect(x, y, width, height, radius, fill, stroke) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + width, y, x + width, y + height, r);
  ctx.arcTo(x + width, y + height, x, y + height, r);
  ctx.arcTo(x, y + height, x, y, r);
  ctx.arcTo(x, y, x + width, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ============================================
// PLAYER
// ============================================
const PW = 30;
const PH = 42;

class Player {
  constructor() {
    this.x = W / 2 - PW / 2;
    this.y = GROUND_Y - PH;
    this.w = PW;
    this.h = PH;
    this.vx = 0;
    this.hp = MAX_HP;
    this.invTimer = 0;
    this.dead = false;
    this.deathTick = 0;
    this.walkTick = 0;
    this.walkFrame = 0;
    this.facing = 1;
    this.doubleShot = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get top() { return this.y; }
  get bottom() { return this.y + this.h; }

  update() {
    if (this.dead) {
      this.deathTick++;
      return;
    }

    if (this.invTimer > 0) this.invTimer--;
    if (this.doubleShot > 0) this.doubleShot--;

    const goL = K.ArrowLeft || K.KeyA;
    const goR = K.ArrowRight || K.KeyD;

    if (goL) {
      this.vx = -5;
      this.facing = -1;
    } else if (goR) {
      this.vx = 5;
      this.facing = 1;
    } else {
      this.vx *= 0.72;
    }

    this.x += this.vx;
    this.x = clamp(this.x, 4, W - this.w - 4);
    this.y = GROUND_Y - PH;

    this.walkTick++;
    if (Math.abs(this.vx) > 0.5 && this.walkTick % 7 === 0) {
      this.walkFrame = (this.walkFrame + 1) % 4;
    }
  }

  hurt(amount = 1) {
    if (this.invTimer > 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.invTimer = 100;
    shake = 12;
    spawnP(this.cx, this.y + PH / 2, '#F44336', 8);
    SFX.hurt();
    if (this.hp <= 0) {
      this.dead = true;
      SFX.die();
    }
  }

  draw() {
    if (this.dead) {
      ctx.save();
      ctx.translate(this.x + PW / 2, this.y + PH / 2);
      ctx.rotate(this.deathTick * 0.15);
      ctx.globalAlpha = Math.max(0, 1 - this.deathTick / 60);
      this._body();
      ctx.restore();
      return;
    }

    if (this.invTimer > 0 && Math.floor(this.invTimer / 5) % 2 === 0) return;

    ctx.save();
    ctx.translate(this.x + PW / 2, this.y + PH / 2);
    if (this.facing === -1) ctx.scale(-1, 1);

    if (this.doubleShot > 0) {
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 55) * 0.2;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    this._body();
    ctx.restore();
  }

  _body() {
    ctx.fillStyle = '#3E2000';
    ctx.beginPath(); ctx.ellipse(-7, 19, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, 19, 7, 4, 0, 0, Math.PI * 2); ctx.fill();

    const lk = Math.sin(this.walkFrame * 0.9) * 3;
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(-11, 7 + lk, 9, 13);
    ctx.fillRect(2, 7 - lk, 9, 13);

    ctx.fillStyle = '#F57F17';
    ctx.fillRect(-13, -9, 26, 18);
    ctx.fillStyle = '#4E342E';
    ctx.fillRect(-13, 7, 26, 5);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-4, 6, 8, 7);

    ctx.fillStyle = '#EF6C00';
    ctx.fillRect(-13, -9, 26, 8);
    ctx.fillRect(-19, -8, 7, 11);
    ctx.fillRect(12, -8, 7, 11);

    ctx.fillStyle = '#FFCBA4';
    ctx.beginPath(); ctx.arc(-16, 4, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 4, 4.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#546E7A';
    ctx.fillRect(13, -4, 14, 7);
    ctx.fillStyle = '#B0BEC5';
    ctx.fillRect(26, -3, 5, 5);

    ctx.fillStyle = '#FFCBA4';
    ctx.beginPath(); ctx.arc(0, -19, 13, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#795548';
    ctx.fillRect(-15, -28, 30, 8);
    ctx.fillRect(-10, -40, 20, 14);
    ctx.fillStyle = '#A1887F';
    ctx.fillRect(-15, -28, 30, 3);

    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(4, -21, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -21, 3, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -15, 5, 0, Math.PI);
    ctx.stroke();
  }
}

// ============================================
// WIRE
// ============================================
class Wire {
  constructor(x) {
    this.x = x;
    this.tipY = GROUND_Y - PH;
    this.baseY = GROUND_Y - PH;
    this.speed = 10;
    this.dead = false;
  }

  update(bubs, plats) {
    if (this.dead) return;

    this.tipY -= this.speed;
    if (this.tipY <= CEIL_Y) {
      this.tipY = CEIL_Y;
      this.dead = true;
      return;
    }

    for (const p of plats) {
      if (this.x >= p.x && this.x <= p.x + p.w && this.tipY <= p.y && this.tipY + this.speed >= p.y) {
        this.tipY = p.y;
        this.dead = true;
        return;
      }
    }

    for (let i = bubs.length - 1; i >= 0; i--) {
      const b = bubs[i];
      const cy = clamp(b.y, this.tipY, this.baseY);
      const dx = b.x - this.x;
      const dy = b.y - cy;
      if (Math.sqrt(dx * dx + dy * dy) < b.r + 2) {
        this.dead = true;
        popBubble(i);
        return;
      }
    }
  }

  draw() {
    if (this.dead) return;

    const linkH = 9;
    for (let y = this.baseY; y > this.tipY; y -= linkH) {
      const frac = (this.baseY - y) / (this.baseY - this.tipY + 1);
      ctx.strokeStyle = `hsl(${48 - frac * 15},92%,${52 + frac * 18}%)`;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(this.x, y);
      ctx.lineTo(this.x, Math.max(this.tipY, y - linkH));
      ctx.stroke();

      if (Math.floor((this.baseY - y) / linkH) % 2 === 0) {
        ctx.strokeStyle = 'rgba(255,230,60,.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(this.x - 3.5, y - linkH / 2);
        ctx.lineTo(this.x + 3.5, y - linkH / 2);
        ctx.stroke();
      }
    }

    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(this.x, this.tipY, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#E65100';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(this.x, this.tipY, 5.5, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ============================================
// BUBBLE
// ============================================
class Bubble {
  constructor(x, y, size, dir, letter, sm) {
    this.x = x;
    this.y = y;
    this.size = size;
    const p = BP[size];
    this.r = p.r;
    this.baseCol = p.col;
    this.sm = sm || 1;
    this.vx = dir * SIZE_SPEED[size] * this.sm;
    this.vy = p.bvy * (0.72 + this.sm * 0.2);
    this.bvy = p.bvy * (0.82 + this.sm * 0.3);
    this.letter = letter || '';
    this.isTarget = false;
    this.frozen = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.stallFrames = 0;
  }

  update(plats) {
    if (this.frozen > 0) {
      this.frozen--;
      this.phase += 0.02;
      return;
    }

    const prevX = this.x;
    const prevY = this.y;
    const prevBottom = prevY + this.r;

    this.phase += 0.045;
    this.vy += GR;
    this.x += this.vx;
    this.y += this.vy;

    if (this.x - this.r < 4) {
      this.x = 4 + this.r;
      this.vx = Math.abs(this.vx);
    }
    if (this.x + this.r > W - 4) {
      this.x = W - 4 - this.r;
      this.vx = -Math.abs(this.vx);
    }
    if (this.y - this.r < CEIL_Y) {
      this.y = CEIL_Y + this.r;
      this.vy = Math.max(Math.abs(this.vy) * 0.96, MIN_BOUNCE_SPEED[this.size]);
    }
    if (this.y + this.r >= GROUND_Y) {
      this.y = GROUND_Y - this.r;
      this.vy = -Math.max(Math.abs(this.bvy), Math.abs(this.vy), MIN_BOUNCE_SPEED[this.size]);
    }

    for (const p of plats) {
      if (
        this.x + this.r > p.x &&
        this.x - this.r < p.x + p.w &&
        prevBottom <= p.y + 6 &&
        this.y + this.r >= p.y &&
        this.y - this.r < p.y + 20 &&
        this.vy > 0
      ) {
        this.y = p.y - this.r;
        this.vy = -Math.max(Math.abs(this.bvy), MIN_BOUNCE_SPEED[this.size] * 0.96);
        break;
      }
    }

    const minHorizontal = MIN_HORIZONTAL_SPEED[this.size] * (0.85 + this.sm * 0.28);
    if (Math.abs(this.vx) < minHorizontal) {
      const fallbackDir = Math.abs(this.vx) > 0.05 ? Math.sign(this.vx) : (prevX >= W / 2 ? -1 : 1);
      this.vx = fallbackDir * minHorizontal;
    }

    if (this.y + this.r >= GROUND_Y - 1 && Math.abs(this.vy) < MIN_BOUNCE_SPEED[this.size]) {
      this.vy = -Math.max(Math.abs(this.bvy), MIN_BOUNCE_SPEED[this.size] * 1.12);
    }

    const movedX = Math.abs(this.x - prevX);
    const movedY = Math.abs(this.y - prevY);
    const nearSurface = this.y + this.r >= GROUND_Y - 2 || plats.some((p) => Math.abs((this.y + this.r) - p.y) < 4);
    if (nearSurface && movedX < 0.12 && movedY < 0.12) {
      this.stallFrames++;
    } else {
      this.stallFrames = 0;
    }

    if (this.stallFrames > 8) {
      const kickDir = this.x >= W / 2 ? -1 : 1;
      this.vx = kickDir * Math.max(minHorizontal, MIN_HORIZONTAL_SPEED[this.size] * 1.28);
      this.vy = -Math.max(Math.abs(this.bvy) * 1.04, MIN_BOUNCE_SPEED[this.size] * 1.35);
      this.stallFrames = 0;
    }
  }

  draw(showHelper) {
    const wob = Math.sin(this.phase) * 2.5;
    ctx.save();
    ctx.translate(this.x, this.y);

    if (showHelper && this.isTarget) {
      const pulse = 0.5 + Math.sin(this.phase * 2.2) * 0.35;

      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = 25;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, wob, this.r + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = pulse * 0.5;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, wob, this.r + 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (this.frozen > 0) {
      ctx.fillStyle = 'rgba(160,230,255,0.4)';
      ctx.beginPath();
      ctx.arc(0, wob, this.r, 0, Math.PI * 2);
      ctx.fill();
    }

    const g = ctx.createRadialGradient(-this.r * 0.3, -this.r * 0.3 + wob, this.r * 0.08, 0, wob, this.r);
    g.addColorStop(0, 'rgba(255,255,255,.72)');
    g.addColorStop(0.4, this.baseCol);
    g.addColorStop(1, shadeHex(this.baseCol, -40));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, wob, this.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = this.isTarget ? '#FFD700' : 'rgba(255,255,255,.35)';
    ctx.lineWidth = this.isTarget ? 3 : 1.5;
    if (this.isTarget) {
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = 8;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    const ll = this.letter.length;
    const fs = ll > 4 ? 10 : ll > 3 ? 12 : ll > 1 ? 15 : 20;
    ctx.font = `bold ${fs}px Arial`;
    ctx.fillStyle = this.isTarget ? '#1A237E' : 'rgba(255,255,255,.97)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 4;
    ctx.fillText(this.letter, 0, wob);
    ctx.shadowBlur = 0;

    if (this.isTarget) {
      ctx.fillStyle = '#FFD700';
      const cr = this.r * 0.52;
      ctx.beginPath();
      ctx.moveTo(-cr, -this.r);
      ctx.lineTo(-cr, -this.r - 10);
      ctx.lineTo(-cr * 0.35, -this.r - 5);
      ctx.lineTo(0, -this.r - 13);
      ctx.lineTo(cr * 0.35, -this.r - 5);
      ctx.lineTo(cr, -this.r - 10);
      ctx.lineTo(cr, -this.r);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#FF8F00';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.restore();
  }
}

// ============================================
// POWER-UP
// ============================================
class PowerUp {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.vy = -2.5;
    this.type = type;
    this.r = 16;
    this.dead = false;
    this.tick = 0;
  }

  update() {
    this.tick++;
    this.vy += GR * 0.55;
    this.y += this.vy;

    if (this.y - this.r >= GROUND_Y) {
      this.y = GROUND_Y - this.r;
      this.vy = 0;
    }

    const dx = player.cx - this.x;
    const dy = (player.y + PH / 2) - this.y;
    if (Math.sqrt(dx * dx + dy * dy) < this.r + 18 && !player.dead) {
      this.dead = true;

      if (this.type === 'freeze') {
        bubbles.forEach((b) => { b.frozen = 110; });
        SFX.freeze();
        spawnP(W / 2, H / 2, '#80D8FF', 18, 'PAUSA');
      } else if (this.type === 'double') {
        player.doubleShot = 350;
        spawnP(player.cx, player.y, '#FFD700', 10, '2x');
      } else if (this.type === 'life') {
        player.hp = Math.min(MAX_HP, player.hp + 2);
        spawnP(player.cx, player.y, '#4CAF50', 12, '+HP');
      } else if (this.type === 'shield') {
        player.invTimer = 280;
        spawnP(player.cx, player.y, '#4FC3F7', 12, 'ESC');
      }

      SFX.pup();
    }

    if (this.y > H + 50) this.dead = true;
  }

  draw() {
    if (this.dead) return;
    const bob = Math.sin(this.tick * 0.09) * 5;
    ctx.save();
    ctx.translate(this.x, this.y + bob);
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'white';

    const cols = { freeze: '#0288D1', double: '#F9A825', life: '#E53935', shield: '#7B1FA2' };
    const icons = { freeze: 'F', double: 'x2', life: '+', shield: '*' };
    ctx.fillStyle = cols[this.type] || '#888';
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icons[this.type], 0, 0);
    ctx.restore();
  }
}

// ============================================
// GAME STATE
// ============================================
let gState = 'intro';
let curLvlIdx = 0;
let score = 0;
let lives = 3;
let combo = 0;
let comboTick = 0;
let curTarget = '';
let player;
let bubbles = [];
let wires = [];
let pups = [];
let plats = [];
let levelSM = 1;
let shake = 0;
let spaceWasDown = false;
let lcTick = 0;
let wbTick = 0;
let wbWorld = -1;
let celebText = '';
let celebTick = 0;
let wrongFlash = 0;
let totalPopped = 0;
let wrongPops = 0;

function syncTargets() {
  bubbles.forEach((b) => { b.isTarget = (b.letter === curTarget); });
}

function ensureTargetPresence() {
  if (!bubbles.length || !curTarget) return;
  const hasTarget = bubbles.some((b) => b.letter === curTarget);
  if (hasTarget) {
    syncTargets();
    return;
  }

  const pick = bubbles[Math.floor(Math.random() * bubbles.length)];
  pick.letter = curTarget;
  syncTargets();
}

function pickTarget() {
  const lv = LEVELS[curLvlIdx];
  const prev = curTarget;
  let t;
  do {
    t = lv.tgts[Math.floor(Math.random() * lv.tgts.length)];
  } while (t === prev && lv.tgts.length > 1);
  curTarget = t;
  syncTargets();
  ensureTargetPresence();
}

function assignLetter(lv) {
  const isT = Math.random() < 0.5;
  const pool = isT ? lv.tgts : lv.dist;
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildLevel(li, options = {}) {
  const { resetLives = true, newTarget = true } = options;
  const lv = LEVELS[li];

  levelSM = lv.sm;
  plats = (lv.ps || []).map((p) => ({ ...p }));
  bubbles = lv.bs.map((spec) => {
    const bp = BP[spec.s];
    return new Bubble(spec.x, CEIL_Y + bp.r + 10, spec.s, spec.d, '', lv.sm);
  });

  bubbles.forEach((b) => { b.letter = assignLetter(lv); });

  wires = [];
  pups = [];
  player = new Player();
  shake = 0;
  totalPopped = 0;
  wrongPops = 0;

  if (resetLives) lives = lv.lives;
  if (newTarget || !lv.tgts.includes(curTarget)) pickTarget();
  else {
    syncTargets();
    ensureTargetPresence();
  }
}

// ============================================
// POP BUBBLE
// ============================================
function popBubble(i) {
  const b = bubbles[i];
  const lv = LEVELS[curLvlIdx];
  const correct = b.letter === curTarget;
  let rotateTarget = false;
  totalPopped++;

  if (correct) {
    combo++;
    comboTick = 180;
    const pts = 100 * Math.max(1, combo);
    score += pts;
    spawnP(b.x, b.y, '#FFD700', 14, `+${pts}`);
    SFX.popGood();
    celebText = CELEB[Math.floor(Math.random() * CELEB.length)];
    celebTick = 70;
    rotateTarget = Math.random() < 0.4;
  } else {
    wrongPops++;
    if (lv.pen === 0) {
      spawnP(b.x, b.y, 'rgba(255,100,100,0.8)', 4, '');
      SFX.popSoft();
    } else {
      combo = 0;
      comboTick = 0;
      player.hp = Math.max(0, player.hp - lv.pen);
      player.invTimer = 55;
      wrongFlash = 12;
      spawnP(b.x, b.y, '#F44336', 8, 'X');
      SFX.popBad();
      if (player.hp <= 0) {
        player.dead = true;
        SFX.die();
      }
    }
  }

  if (b.size > 0) {
    for (let s = 0; s < 2; s++) {
      const child = new Bubble(b.x, b.y, b.size - 1, s === 0 ? -1 : 1, '', levelSM);
      child.letter = assignLetter(lv);
      child.vy = BP[b.size - 1].bvy * (0.28 + levelSM * 0.72) * 0.55;
      bubbles.push(child);
    }
    SFX.split();
  }

  const pupChance = levelSM > 0.45 ? 0.18 : 0.08;
  if (Math.random() < pupChance) {
    const types = ['freeze', 'double', 'life', 'shield'];
    pups.push(new PowerUp(b.x, b.y, types[Math.floor(Math.random() * types.length)]));
  }

  bubbles.splice(i, 1);

  if (bubbles.length > 0) {
    if (rotateTarget) pickTarget();
    else {
      syncTargets();
      ensureTargetPresence();
    }
  }
}

// ============================================
// UPDATE
// ============================================
function update() {
  if (gState === 'worldbanner') {
    wbTick++;
    if (wbTick > 180 || ((K.Space || K.ArrowUp) && wbTick > 30)) {
      gState = 'playing';
      spaceWasDown = true;
    }
    return;
  }

  if (gState !== 'playing' && gState !== 'lvlcomplete') return;

  if (gState === 'lvlcomplete') {
    lcTick++;
    tickP();
    if (lcTick > 220) advanceLevel();
    return;
  }

  if (shake > 0) shake--;
  if (comboTick > 0) {
    comboTick--;
    if (comboTick <= 0) combo = 0;
  }
  if (celebTick > 0) celebTick--;
  if (wrongFlash > 0) wrongFlash--;

  player.update();

  const spDown = K.Space || K.ArrowUp || K.KeyW;
  if (spDown && !spaceWasDown && !player.dead) {
    const maxW = player.doubleShot > 0 ? 2 : 1;
    if (wires.length < maxW) {
      if (player.doubleShot > 0 && wires.length === 0) {
        wires.push(new Wire(player.cx - 9));
        wires.push(new Wire(player.cx + 9));
      } else if (wires.length === 0) {
        wires.push(new Wire(player.cx));
      }
      SFX.shoot();
    }
  }
  spaceWasDown = spDown;

  wires.forEach((w) => w.update(bubbles, plats));
  wires = wires.filter((w) => !w.dead);

  bubbles.forEach((b) => b.update(plats));

  if (!player.dead) {
    for (const b of bubbles) {
      const dx = player.cx - b.x;
      const dy = (player.y + PH / 2) - b.y;
      if (Math.sqrt(dx * dx + dy * dy) < b.r + PW * 0.4) {
        player.hurt(1);
        break;
      }
    }
  }

  pups.forEach((p) => p.update());
  pups = pups.filter((p) => !p.dead);
  tickP();

  if (bubbles.length === 0) {
    gState = 'lvlcomplete';
    lcTick = 0;
    SFX.bravo();
  }

  if (player.dead && player.deathTick > 90) {
    if (lives < 999) lives--;
    if (lives <= 0) {
      gState = 'gameover';
    } else {
      buildLevel(curLvlIdx, { resetLives: false, newTarget: true });
    }
  }
}

function advanceLevel() {
  curLvlIdx++;
  if (curLvlIdx >= LEVELS.length) {
    gState = 'win';
    SFX.fanfare();
    return;
  }

  const newWorld = LEVELS[curLvlIdx].th;
  const oldWorld = LEVELS[curLvlIdx - 1].th;
  combo = 0;
  comboTick = 0;
  buildLevel(curLvlIdx, { resetLives: true, newTarget: true });

  if (newWorld !== oldWorld) {
    wbWorld = newWorld;
    wbTick = 0;
    gState = 'worldbanner';
  } else {
    gState = 'playing';
  }
}

// ============================================
// DRAW HELPERS
// ============================================
function drawArrowHelper() {
  const lv = LEVELS[curLvlIdx];
  if (!lv.arrow) return;

  const correct = bubbles.filter((b) => b.isTarget);
  const t = Date.now() / 800;
  correct.forEach((b) => {
    const ay = b.y - b.r - 22 + Math.sin(t * 3) * 8;
    ctx.save();
    ctx.fillStyle = `rgba(255,220,50,${0.75 + Math.sin(t * 3) * 0.2})`;
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 10;
    ctx.fillText('v', b.x, ay);
    ctx.restore();
  });
}

function drawCelebration() {
  if (celebTick <= 0) return;
  const alpha = Math.min(1, celebTick / 20);
  const scale = 1 + Math.sin((70 - celebTick) / 70 * Math.PI) * 0.4;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2 - 40);
  ctx.scale(scale, scale);
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 30;
  ctx.font = 'bold 52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFD700';
  ctx.fillText(celebText, 0, 0);
  ctx.restore();
}

// ============================================
// DRAW WORLD
// ============================================
function drawWorld() {
  const lv = LEVELS[curLvlIdx];
  const th = THEMES[lv.th];

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, th.bg1);
  bg.addColorStop(1, th.bg2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let r = 0; r < 14; r++) {
    for (let c = 0; c < 17; c++) {
      if ((r + c) % 2 === 0) ctx.fillRect(c * 50, r * 38, 48, 36);
    }
  }

  plats.forEach((p) => {
    ctx.fillStyle = th.deco;
    ctx.fillRect(p.x, p.y, p.w, 16);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(p.x, p.y + 12, p.w, 4);
    ctx.strokeStyle = 'rgba(0,0,0,.2)';
    ctx.lineWidth = 1;
    for (let bx = p.x; bx < p.x + p.w; bx += 42) {
      ctx.beginPath();
      ctx.moveTo(bx, p.y);
      ctx.lineTo(bx, p.y + 16);
      ctx.stroke();
    }
  });

  ctx.fillStyle = th.floor;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(0, GROUND_Y, W, 4);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(0, GROUND_Y + 4, W, 5);
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;
  for (let tx = 0; tx < W; tx += 50) {
    ctx.beginPath();
    ctx.moveTo(tx, GROUND_Y);
    ctx.lineTo(tx, H);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fillRect(0, CEIL_Y, 5, GROUND_Y - CEIL_Y);
  ctx.fillRect(W - 5, CEIL_Y, 5, GROUND_Y - CEIL_Y);

  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(0, CEIL_Y, W, 2);

  if (wrongFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${wrongFlash / 12 * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }

  pups.forEach((p) => p.draw());
  wires.forEach((w) => w.draw());
  bubbles.forEach((b) => b.draw(lv.arrow));
  drawArrowHelper();
  player.draw();
  drawP();
  drawCelebration();
  drawHUD();
}

// ============================================
// HUD
// ============================================
function drawHUD() {
  const lv = LEVELS[curLvlIdx];
  const th = THEMES[lv.th];

  ctx.fillStyle = 'rgba(20,8,18,.76)';
  ctx.fillRect(0, 0, W, CEIL_Y);
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, CEIL_Y);
  ctx.lineTo(W, CEIL_Y);
  ctx.stroke();

  ctx.textBaseline = 'middle';
  if (lv.lives >= 999) {
    ctx.fillStyle = '#4CAF50';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('∞ Vidas', 16, 38);
  } else {
    ctx.font = '24px Arial';
    ctx.textAlign = 'left';
    for (let i = 0; i < lv.lives; i++) {
      ctx.fillStyle = i < lives ? '#E53935' : '#333';
      ctx.fillText('♥', 16 + i * 28, 38);
    }
  }

  ctx.fillStyle = 'white';
  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`PUNTOS: ${score}`, W / 2, 28);

  ctx.fillStyle = th.accent;
  ctx.font = '15px Arial';
  ctx.fillText(`${th.name} • Nivel ${curLvlIdx + 1} / ${LEVELS.length}`, W / 2, 56);

  const dotsW = Math.min(LEVELS.length, 36) * 10 + 4;
  const dotsX = W / 2 - dotsW / 2;
  for (let i = 0; i < LEVELS.length; i++) {
    ctx.fillStyle = i < curLvlIdx ? '#4CAF50' : i === curLvlIdx ? '#FFD700' : 'rgba(255,255,255,.2)';
    ctx.beginPath();
    ctx.arc(dotsX + i * 10 + 5, CEIL_Y - 12, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  if (combo > 1) {
    ctx.fillStyle = `hsl(${40 + combo * 7},100%,62%)`;
    ctx.font = `bold ${16 + Math.min(combo * 2, 14)}px Arial`;
    ctx.textAlign = 'right';
    ctx.fillText(`COMBO x${combo}!`, W - 240, 38);
  }

  const hpX = W - 228;
  const hpY = 16;
  drawSegmentedBar(hpX, hpY, 188, 18, player.hp, MAX_HP);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '10px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('VIDA', hpX - 6, hpY + 13);

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '13px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`Burbujas: ${bubbles.length}`, 16, 70);

  if (player.doubleShot > 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = '13px Arial';
    ctx.fillText(`x2 ${Math.ceil(player.doubleShot / 60)}s`, 122, 70);
  }

  const tw = Math.max(210, curTarget.length * 28 + 94);
  const tx = W - tw - 16;
  const ty = 42;
  const thh = 54;
  ctx.fillStyle = 'rgba(8,10,18,.88)';
  roundRect(tx, ty, tw, thh, 18, true, false);

  const t2 = Date.now() / 400;
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 14 + Math.sin(t2) * 5;
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  roundRect(tx, ty, tw, thh, 18, false, true);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#FFB74D';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('OBJETIVO ACTUAL', tx + 16, ty + 14);

  const fst = curTarget.length > 4 ? 18 : curTarget.length > 2 ? 24 : 34;
  ctx.font = `bold ${fst}px Arial`;
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 14;
  ctx.fillStyle = 'white';
  ctx.textAlign = 'left';
  ctx.fillText(curTarget, tx + 18, ty + 35);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'right';
  if (lv.pen === 0) {
    ctx.fillStyle = '#4CAF50';
    ctx.fillText('Sin penalización', tx + tw - 16, ty + 36);
  } else if (lv.pen === 0.5) {
    ctx.fillStyle = '#FFB74D';
    ctx.fillText('Fallo: media barra', tx + tw - 16, ty + 36);
  } else {
    ctx.fillStyle = '#EF5350';
    ctx.fillText('Fallo: barra completa', tx + tw - 16, ty + 36);
  }

  ctx.fillStyle = 'rgba(255,255,255,.76)';
  ctx.font = '12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(lv.tip || 'Busca la burbuja correcta', W / 2, 84);
}

// ============================================
// LEVEL COMPLETE
// ============================================
function drawLCBanner() {
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(0, 0, W, H);

  const stars = wrongPops === 0 ? 3 : wrongPops < 3 ? 2 : 1;
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < stars ? '#FFD700' : '#444';
    drawStarShape(W / 2 - 80 + i * 80, H / 2 - 80, 30, 13, 5);
  }

  ctx.save();
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 28;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 50px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('¡NIVEL COMPLETADO!', W / 2, H / 2 - 10);
  ctx.restore();

  const msg = LVLMSGS[curLvlIdx % LVLMSGS.length];
  ctx.fillStyle = '#A5D6A7';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, H / 2 + 40);

  ctx.fillStyle = 'white';
  ctx.font = '16px Arial';
  ctx.fillText(`Puntos: ${score}`, W / 2, H / 2 + 80);

  const ni = curLvlIdx + 1;
  if (ni < LEVELS.length) {
    ctx.fillStyle = THEMES[LEVELS[ni].th].accent;
    ctx.font = '14px Arial';
    ctx.fillText(`Siguiente -> Nivel ${ni + 1}: ${THEMES[LEVELS[ni].th].name}`, W / 2, H / 2 + 110);
  }

  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '13px Arial';
  ctx.fillText('Continuando...', W / 2, H / 2 + 138);
}

// ============================================
// WORLD BANNER
// ============================================
function drawWorldBanner() {
  const th = THEMES[wbWorld];
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, th.bg1);
  bg.addColorStop(1, th.bg2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() / 1000;
  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(t + i) * 0.18})`;
    ctx.beginPath();
    ctx.arc((i * 137.5) % W, (i * 97.3) % H, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.shadowColor = 'white';
  ctx.shadowBlur = 30;
  ctx.fillStyle = th.accent;
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`MUNDO ${wbWorld + 1}`, W / 2, H / 2 - 70);
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 64px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(th.name, W / 2, H / 2);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.font = '20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(LVLMSGS[wbWorld % LVLMSGS.length], W / 2, H / 2 + 65);

  if (Math.floor(t * 2) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('Presiona ESPACIO para continuar', W / 2, H / 2 + 110);
  }
}

// ============================================
// INTRO
// ============================================
function drawIntro() {
  const t = Date.now() / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a237e');
  bg.addColorStop(0.5, '#880e4f');
  bg.addColorStop(1, '#1a237e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.12 + Math.sin(t + i) * 0.12})`;
    ctx.beginPath();
    ctx.arc((i * 137.5) % W, (i * 97.3) % H, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }

  [
    { x: 120, y: 200, s: 3, l: 'A', bob: 0 },
    { x: 300, y: 170, s: 2, l: 'MA', bob: 1 },
    { x: 500, y: 190, s: 2, l: 'PATO', bob: 2 },
    { x: 660, y: 175, s: 3, l: 'B', bob: 3 }
  ].forEach((b) => {
    const r = BP[b.s].r;
    const by = b.y + Math.sin(t * 1.2 + b.bob) * 14;
    ctx.save();
    ctx.translate(b.x, by);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.08, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,.7)');
    g.addColorStop(1, BP[b.s].col);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'white';
    ctx.font = `bold ${b.l.length > 2 ? 11 : b.l.length > 1 ? 14 : 20}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.l, 0, 0);
    ctx.restore();
  });

  ctx.save();
  ctx.shadowColor = '#FF9800';
  ctx.shadowBlur = 40;
  const tg = ctx.createLinearGradient(W / 2 - 220, 0, W / 2 + 220, 0);
  tg.addColorStop(0, '#FF9800');
  tg.addColorStop(0.5, '#FF4081');
  tg.addColorStop(1, '#4FC3F7');
  ctx.fillStyle = tg;
  ctx.font = 'bold 86px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('LetraPang', W / 2, 110);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('¡Revienta las burbujas · Aprende a Leer!', W / 2, 172);

  THEMES.forEach((th, i) => {
    const col = Math.floor(i % 3);
    const row = Math.floor(i / 3);
    const cx2 = W / 2 - 245 + col * 170;
    const cy2 = 210 + row * 100;
    const cw = 152;
    const ch = 86;
    const cg = ctx.createLinearGradient(cx2, cy2, cx2, cy2 + ch);
    cg.addColorStop(0, `${th.bg1}cc`);
    cg.addColorStop(1, `${th.bg2}cc`);
    ctx.fillStyle = cg;
    ctx.fillRect(cx2, cy2, cw, ch);
    ctx.strokeStyle = `${th.accent}aa`;
    ctx.lineWidth = 2;
    ctx.strokeRect(cx2, cy2, cw, ch);
    ctx.fillStyle = th.accent;
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`Mundo ${i + 1}`, cx2 + cw / 2, cy2 + 16);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px Arial';
    ctx.fillText(th.name, cx2 + cw / 2, cy2 + 36);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = '10px Arial';
    ctx.fillText('6 niveles', cx2 + cw / 2, cy2 + 54);
    for (let d = 0; d < 6; d++) {
      const prog = d / (i < 2 ? 8 : i < 4 ? 5 : 3);
      ctx.fillStyle = `hsl(${120 - prog * 120},80%,55%)`;
      ctx.beginPath();
      ctx.arc(cx2 + cw / 2 - 25 + d * 10, cy2 + 70, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  if (Math.floor(t * 2) % 2 === 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('> Presiona ESPACIO para empezar <', W / 2, 432);
  }
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '12px Arial';
  ctx.fillText('← → Mover · ESPACIO/↑ Disparar arpón · Recoge power-ups del suelo', W / 2, 462);
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.font = '11px Arial';
  ctx.fillText('Sin penalización en niveles iniciales · Dificultad progresiva · 36 niveles', W / 2, 483);
}

// ============================================
// GAME OVER
// ============================================
function drawGameOver() {
  const t = Date.now() / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0000');
  bg.addColorStop(1, '#3a0000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#F44336';
  ctx.shadowBlur = 30 + Math.sin(t * 2) * 8;
  ctx.fillStyle = '#F44336';
  ctx.font = 'bold 72px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('¡CASI LO LOGRAS!', W / 2, H / 2 - 70);
  ctx.restore();

  ctx.fillStyle = 'white';
  ctx.font = '26px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`Puntuación: ${score}`, W / 2, H / 2);

  ctx.fillStyle = '#FFCDD2';
  ctx.font = '20px Arial';
  ctx.fillText('¡Inténtalo de nuevo, tú puedes!', W / 2, H / 2 + 50);

  ctx.fillStyle = '#aaa';
  ctx.font = '16px Arial';
  ctx.fillText(`Llegaste hasta el Nivel ${curLvlIdx + 1}: ${THEMES[LEVELS[curLvlIdx].th].name}`, W / 2, H / 2 + 88);

  if (Math.floor(t * 1.8) % 2 === 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('Presiona ESPACIO para volver al inicio', W / 2, H / 2 + 135);
  }
}

// ============================================
// VICTORY
// ============================================
function drawVictory() {
  const t = Date.now() / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1B5E20');
  bg.addColorStop(1, '#004D40');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 110; i++) {
    ctx.fillStyle = `hsl(${(i * 137 + t * 55) % 360},85%,62%)`;
    ctx.save();
    ctx.translate((i * 137.5 + t * 35) % W, (i * 97.3 + t * 25) % H);
    ctx.rotate(t + i);
    ctx.fillRect(-5, -3, 10, 6);
    ctx.restore();
  }

  ctx.save();
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 45 + Math.sin(t * 3) * 12;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 58px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('¡FELICITACIONES!', W / 2, 100);
  ctx.restore();

  ctx.fillStyle = 'white';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('¡Completaste los 36 niveles!', W / 2, 170);

  ctx.fillStyle = '#FFD700';
  for (let i = 0; i < 5; i++) drawStarShape(W / 2 - 160 + i * 80, 240, 24, 11, 5);

  ctx.fillStyle = '#A5D6A7';
  ctx.font = 'bold 24px Arial';
  ctx.fillText('¡Ahora sabes leer mucho mejor!', W / 2, 300);

  ctx.fillStyle = '#80DEEA';
  ctx.font = '20px Arial';
  ctx.fillText(`Puntuación total: ${score}`, W / 2, 345);

  ctx.fillStyle = 'white';
  ctx.font = '18px Arial';
  ctx.fillText('¡Eres increíble, campeón/a!', W / 2, 388);

  if (Math.floor(t * 1.8) % 2 === 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('Presiona ESPACIO para volver al inicio', W / 2, 440);
  }
}

// ============================================
// START GAME
// ============================================
function startGame() {
  curLvlIdx = 0;
  score = 0;
  combo = 0;
  comboTick = 0;
  curTarget = '';
  buildLevel(0, { resetLives: true, newTarget: true });
  wbWorld = 0;
  wbTick = 0;
  gState = 'worldbanner';
}

// ============================================
// MAIN LOOP
// ============================================
function draw() {
  ctx.clearRect(0, 0, W, H);

  if (gState === 'intro') {
    drawIntro();
    return;
  }
  if (gState === 'gameover') {
    drawGameOver();
    return;
  }
  if (gState === 'win') {
    drawVictory();
    return;
  }
  if (gState === 'worldbanner') {
    drawWorldBanner();
    return;
  }

  ctx.save();
  if (shake > 0) {
    ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  }

  if (gState === 'playing') {
    drawWorld();
  }
  if (gState === 'lvlcomplete') {
    drawWorld();
    drawLCBanner();
  }
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
