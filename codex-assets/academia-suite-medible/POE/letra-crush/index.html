<!DOCTYPE html><html lang="es"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Letra Crush - Juego Educativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --candy-pink: #ff69b4;
            --candy-purple: #9b59b6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background container */
        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #F7DC6F 100%);
        }

        .game-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Mode Panel */
        .mode-panel {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }

        .mode-label {
            font-family: 'Baloo 2', cursive;
            color: #fff;
            font-size: 0.8rem;
        }

        .mode-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.7rem;
            padding: 6px 12px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            color: #fff;
            transition: all 0.2s;
        }

        .mode-btn:hover { background: rgba(255,255,255,0.25); }
        .mode-btn.active {
            background: linear-gradient(145deg, #ffd700, #ffb700);
            color: #8B4513;
            border-color: #fff;
        }

        .sound-toggle {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 1rem;
        }

        .sound-toggle.muted { opacity: 0.5; }

        .game-container {
            display: flex;
            gap: 8px;
            max-width: 500px;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 60px;
            flex-shrink: 0;
        }

        .score-panel, .progress-container {
            background: linear-gradient(145deg, #ffb6c1, #ff69b4);
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .score-label { font-family: 'Baloo 2', cursive; font-size: 0.7rem; color: #8B0000; }
        .score-value { font-family: 'Baloo 2', cursive; font-size: 1.1rem; color: #8B0000; font-weight: 800; }

        .progress-container { flex: 1; display: flex; flex-direction: column; align-items: center; }

        .progress-bar-track {
            width: 20px;
            flex: 1;
            background: linear-gradient(180deg, #4a69bd, #1e3799);
            border-radius: 10px;
            position: relative;
            border: 2px solid #fff;
            overflow: hidden;
            min-height: 150px;
        }

        .progress-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #74b9ff, #0984e3);
            transition: height 0.5s ease;
        }

        .progress-stars {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            padding: 5px 0;
        }

        .progress-star { font-size: 1rem; color: rgba(255,255,255,0.3); transition: all 0.3s; }
        .progress-star.earned { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; animation: starPop 0.5s ease; }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); }
            50% { transform: scale(1.5) rotate(0); }
            100% { transform: scale(1) rotate(0); }
        }

        .main-panel { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .header {
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .lives-container { display: flex; gap: 3px; }
        .heart { font-size: 1rem; color: #ff0000; }
        .heart.empty { color: rgba(255,255,255,0.4); }

        .title {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(0.85rem, 3vw, 1.1rem);
            color: #fff;
            text-shadow: 2px 2px 0 #8B0000;
        }

        .coins-badge {
            background: linear-gradient(145deg, #ffd700, #ffb700);
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .coins-badge i, .coins-badge span { color: #8B4513; font-size: 0.9rem; }

        .level-bar {
            background: linear-gradient(145deg, #ffb6c1, #ff69b4);
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-badge, .moves-badge {
            color: #fff;
            padding: 4px 10px;
            border-radius: 15px;
            font-family: 'Baloo 2', cursive;
            font-size: 0.8rem;
            border: 2px solid #fff;
        }

        .level-badge { background: linear-gradient(145deg, #9b59b6, #8e44ad); }
        .moves-badge { background: linear-gradient(145deg, #3498db, #2980b9); }

        .objectives-container { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

        .objective-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.3);
            padding: 2px 5px;
            border-radius: 8px;
        }

        .objective-letter {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo 2', cursive;
            font-size: 0.7rem;
            color: #fff;
        }

        .objective-letter.is-emoji { font-size: 0.9rem; background: #fff !important; }
        .objective-count { font-size: 0.55rem; color: #8B0000; font-weight: 600; }
        .objective-item.done { opacity: 0.5; }

        .board-container {
            background: linear-gradient(145deg, rgba(100,149,237,0.4), rgba(65,105,225,0.5));
            border: 4px solid #fff;
            border-radius: 15px;
            padding: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
        }

        .cell {
            width: clamp(28px, 8vw, 38px);
            height: clamp(28px, 8vw, 38px);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo 2', cursive;
            font-size: clamp(0.75rem, 3vw, 1rem);
            cursor: grab;
            user-select: none;
            position: relative;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            transition: transform 0.15s ease;
            touch-action: none;
        }

        .cell.is-emoji { font-size: clamp(1rem, 4.5vw, 1.3rem); text-shadow: none; }

        /* Piece colors */
        .piece-0 { background: linear-gradient(145deg, #ff6b6b, #cc4444); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3); }
        .piece-1 { background: linear-gradient(145deg, #ffd93d, #d4b125); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.5), 0 2px 4px rgba(0,0,0,0.3); }
        .piece-2 { background: linear-gradient(145deg, #6bcb77, #4a9956); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3); }
        .piece-3 { background: linear-gradient(145deg, #4d96ff, #2d6bc7); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3); }
        .piece-4 { background: linear-gradient(145deg, #a66cff, #7a44cc); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3); }
        .piece-5 { background: linear-gradient(145deg, #ff9f43, #cc7722); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), inset 0 3px 6px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.3); }

        /* HIDDEN CELL - Not part of board */
        .cell.hidden-cell {
            background: transparent !important;
            box-shadow: none !important;
            cursor: default;
            pointer-events: none;
        }
        .cell.hidden-cell * { display: none; }

        /* BLOCKED CELL - Metal/Rock that can't be broken */
        .cell.blocked-cell {
            background: linear-gradient(145deg, #5a5a5a, #2a2a2a) !important;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.5), inset 0 4px 8px rgba(100,100,100,0.3), 0 2px 4px rgba(0,0,0,0.5) !important;
            cursor: not-allowed;
            pointer-events: none;
            border: 2px solid #777;
        }

        .cell.blocked-cell::before {
            content: '🔒';
            font-size: 0.9rem;
        }

        .cell.blocked-cell .piece-text { display: none; }

        /* ICE CELL - Frozen, needs hits to break */
        .cell.ice-1::after,
        .cell.ice-2::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 6px;
            pointer-events: none;
            z-index: 5;
        }

        .cell.ice-1::after {
            background: linear-gradient(145deg, rgba(173,216,250,0.5), rgba(135,206,250,0.3));
            border: 2px solid rgba(200,230,255,0.7);
            box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
        }

        .cell.ice-2::after {
            background: linear-gradient(145deg, rgba(100,180,255,0.7), rgba(70,130,200,0.5));
            border: 3px solid rgba(150,200,255,0.9);
            box-shadow: inset 0 0 12px rgba(255,255,255,0.6), 0 0 8px rgba(100,180,255,0.5);
        }

        .cell.ice-2::before {
            content: '❄️';
            position: absolute;
            font-size: 0.6rem;
            top: -2px;
            right: -2px;
            z-index: 10;
        }

        /* Special cells */
        .cell.striped-h::before,
        .cell.striped-v::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 2;
        }

        .cell.striped-h::before { background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.6) 2px, rgba(255,255,255,0.6) 4px); }
        .cell.striped-v::before { background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.6) 2px, rgba(255,255,255,0.6) 4px); }

        .cell.wrapped { animation: wrappedGlow 1s ease-in-out infinite; }
        .cell.wrapped::before {
            content: '✦';
            position: absolute;
            font-size: 1.4rem;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 8px #fff;
            animation: wrapSpin 2s linear infinite;
            z-index: 3;
        }
        .cell.wrapped .piece-text { opacity: 0.3; }

        @keyframes wrappedGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
        @keyframes wrapSpin { to { transform: rotate(360deg); } }

        .cell.rainbow {
            background: conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #a66cff, #ff6b6b) !important;
            animation: rainbowRotate 2s linear infinite;
            border: 2px solid #fff;
        }
        .cell.rainbow::before { content: '⭐'; font-size: 1.2rem; z-index: 3; }
        .cell.rainbow .piece-text { display: none; }

        @keyframes rainbowRotate { to { filter: hue-rotate(360deg); } }

        .cell.dragging { transform: scale(1.25) !important; z-index: 100; box-shadow: 0 0 20px rgba(255,255,255,0.9) !important; }
        .cell.hint { animation: hintBounce 0.4s ease-in-out infinite alternate; }
        @keyframes hintBounce { to { transform: scale(1.15); box-shadow: 0 0 15px #fff; } }

        .cell.matching { animation: matchPop 0.35s ease-out forwards; }
        @keyframes matchPop { 0% { transform: scale(1); } 50% { transform: scale(1.4); filter: brightness(1.5); } 100% { transform: scale(0); opacity: 0; } }

        .cell.dropping { animation: dropBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes dropBounce { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .cell.invalid { animation: shakeNo 0.4s ease; }
        @keyframes shakeNo { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* Powerups */
        .powerups-bar { display: flex; justify-content: center; gap: 5px; }

        .powerup-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 2px solid #fff;
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .powerup-btn.active { border-color: #ffd700; box-shadow: 0 0 12px #ffd700; }
        .powerup-btn.disabled { opacity: 0.4; pointer-events: none; }
        .powerup-btn i { font-size: 0.9rem; color: #fff; }

        .powerup-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e74c3c;
            color: #fff;
            font-size: 0.5rem;
            font-weight: 700;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
        }

        .word-display {
            background: linear-gradient(145deg, #ffb6c1, #ff69b4);
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 6px 12px;
            text-align: center;
        }

        .word-text { font-family: 'Baloo 2', cursive; font-size: 1rem; color: #8B0000; }
        .word-meaning { font-size: 0.6rem; color: #6B0000; }

        .controls { display: flex; justify-content: center; gap: 8px; }

        .btn {
            font-family: 'Baloo 2', cursive;
            font-size: 0.75rem;
            padding: 6px 14px;
            border: 2px solid #fff;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-hint { background: linear-gradient(145deg, #f1c40f, #f39c12); color: #8B4513; }
        .btn-new { background: linear-gradient(145deg, #2ecc71, #27ae60); color: #fff; }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.5rem, 6vw, 2rem);
            color: #fff;
            text-shadow: 3px 3px 0 #8B0000;
            pointer-events: none;
            z-index: 200;
            animation: popupBounce 1s ease-out forwards;
        }

        @keyframes popupBounce {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            50% { transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); }
        }

        .particles-container { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFly 0.6s ease-out forwards;
        }

        @keyframes particleFly { 0% { opacity: 1; } 100% { opacity: 0; transform: translateY(-80px) scale(0); } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .modal {
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            padding: 20px;
            border-radius: 20px;
            border: 4px solid #fff;
            text-align: center;
            color: #fff;
            max-width: 90%;
            width: 280px;
        }

        .modal-title { font-family: 'Baloo 2', cursive; font-size: 1.2rem; margin-bottom: 10px; }
        .modal-stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0; }
        .modal-star { font-size: 1.6rem; color: rgba(255,255,255,0.3); }
        .modal-star.earned { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .modal-stats { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
        .modal-stat-value { font-family: 'Baloo 2', cursive; font-size: 1.3rem; }
        .modal-stat-label { font-size: 0.6rem; }
        .modal-rewards { background: rgba(255,255,255,0.15); border-radius: 10px; padding: 8px; margin: 8px 0; font-size: 0.75rem; }

        .modal-btn {
            background: linear-gradient(145deg, #ffd700, #ffb700);
            color: #8B4513;
            font-family: 'Baloo 2', cursive;
            font-size: 0.9rem;
            padding: 8px 20px;
            border: 2px solid #fff;
            border-radius: 20px;
            cursor: pointer;
            margin: 4px;
        }

        .modal-btn.secondary { background: linear-gradient(145deg, #9b59b6, #8e44ad); color: #fff; }

        /* Level shape indicator */
        .level-shape {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.8);
            margin-top: 2px;
        }

        @media (max-width: 380px) {
            .left-panel { width: 50px; }
            .mode-btn { padding: 4px 8px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
    <!-- Background with fantasy image -->
    <div class="game-background">
        <img src="https://pfst.cf2.poecdn.net/base/image/77d1bba5aed21ee49dbb69b6d0487a8de0f33ce304ee90b8679316eee5134005?w=1536&amp;h=1024" alt="">
    </div>

    <div class="mode-panel">
        <span class="mode-label">Modo:</span>
        <button class="mode-btn active" data-mode="letters" onclick="setGameMode('letters')">Letras</button>
        <button class="mode-btn" data-mode="phonemes" onclick="setGameMode('phonemes')">Fonemas</button>
        <button class="mode-btn" data-mode="syllables" onclick="setGameMode('syllables')">Sílabas</button>
        <button class="mode-btn" data-mode="images" onclick="setGameMode('images')">Imágenes</button>
        <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <div class="game-container">
        <div class="left-panel">
            <div class="score-panel">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="progress-container">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressFill" style="height: 0%"></div>
                    <div class="progress-stars">
                        <i class="fas fa-star progress-star" id="star3"></i>
                        <i class="fas fa-star progress-star" id="star2"></i>
                        <i class="fas fa-star progress-star" id="star1"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-panel">
            <div class="header">
                <div class="lives-container" id="livesContainer"></div>
                <div class="title" id="gameTitle">LETRA CRUSH</div>
                <div class="coins-badge">
                    <i class="fas fa-coins"></i>
                    <span id="coins">100</span>
                </div>
            </div>

            <div class="level-bar">
                <div>
                    <div class="level-badge">Nivel <span id="levelNum">1</span></div>
                    <div class="level-shape" id="levelShape">Cuadrado</div>
                </div>
                <div class="objectives-container" id="objectives"></div>
                <div class="moves-badge">🎯 <span id="moves">30</span></div>
            </div>

            <div class="board-container">
                <div class="board" id="board"></div>
            </div>

            <div class="powerups-bar">
                <button class="powerup-btn" id="pwrHammer" onclick="activatePowerup('hammer')">
                    <i class="fas fa-hammer"></i>

        // ===================== AUDIO SYSTEM =====================
        let audioCtx = null;
        let soundEnabled = true;
        let audioInitialized = false;
        let audioUnlocked = false;

        function initAudio() {
            if (audioInitialized && audioCtx) return true;
            try {
                // Try to create AudioContext
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) {
                    console.log('AudioContext not supported');
                    return false;
                }

                audioCtx = new AudioContext();
                audioInitialized = true;

                // For Mac/Safari: always try to resume
                unlockAudio();

                return true;
            } catch (e) {
                console.log('Audio init error:', e);
                return false;
            }
        }

        // Mac/Safari requires user gesture to unlock audio
        function unlockAudio() {
            if (!audioCtx) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    audioUnlocked = true;
                    console.log('Audio unlocked');
                }).catch(e => console.log('Resume failed:', e));
            } else if (audioCtx.state === 'running') {
                audioUnlocked = true;
            }

            // Safari workaround: play silent buffer to unlock
            if (!audioUnlocked && audioCtx.state !== 'closed') {
                try {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                    audioUnlocked = true;
                } catch (e) { }
            }
        }

        function ensureAudioReady() {
            if (!audioCtx) {
                initAudio();
                return false;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
                return audioCtx.state === 'running';
            }
            return audioCtx.state === 'running';
        }

        function playTone(freq, duration, type = 'sine', volume = 0.3) {
            if (!soundEnabled || !audioCtx) return;

            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audioCtx.state !== 'running') return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('playTone error:', e);
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;

            // Initialize if needed
            if (!audioCtx) {
                initAudio();
            }

            if (!audioCtx) return;

            // Try to resume if suspended (Mac issue)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    // Retry playing sound after resume
                    playSoundInternal(type);
                });
                return;
            }

            playSoundInternal(type);
        }

        function playSoundInternal(type) {
            if (!audioCtx || audioCtx.state !== 'running') return;

            switch(type) {
                case 'match':
                    playTone(523, 0.1, 'sine', 0.3);
                    setTimeout(() => playTone(659, 0.1, 'sine', 0.25), 50);
                    setTimeout(() => playTone(784, 0.15, 'sine', 0.2), 100);
                    break;
                case 'combo':
                    [523, 659, 784, 880, 1047].forEach((f, i) => {
                        setTimeout(() => playTone(f, 0.1, 'sine', 0.25), i * 50);
                    });
                    break;
                case 'special':
                    [600, 800, 1000, 1200].forEach((f, i) => {
                        setTimeout(() => playTone(f, 0.12, 'triangle', 0.2), i * 40);
                    });
                    break;
                case 'swap':
                    playTone(400, 0.08, 'sine', 0.2);
                    break;
                case 'invalid':
                    playTone(200, 0.15, 'sawtooth', 0.15);
                    setTimeout(() => playTone(150, 0.2, 'sawtooth', 0.1), 80);
                    break;
                case 'drop':
                    playTone(300, 0.08, 'sine', 0.1);
                    break;
                case 'ice':
                    playTone(1200, 0.1, 'sine', 0.2);
                    setTimeout(() => playTone(1400, 0.1, 'sine', 0.15), 50);
                    break;
                case 'levelComplete':
                    [523, 587, 659, 784, 880, 1047].forEach((f, i) => {
                        setTimeout(() => playTone(f, 0.2, 'sine', 0.3), i * 100);
                    });
                    break;
                case 'gameOver':
                    [400, 350, 300, 250].forEach((f, i) => {
                        setTimeout(() => playTone(f, 0.25, 'sine', 0.2), i * 120);
                    });
                    break;
                case 'rainbow':
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => playTone(400 + i * 80, 0.08, 'sine', 0.2), i * 30);
                    }
                    break;
                case 'explosion':
                    playTone(150, 0.2, 'sawtooth', 0.2);
                    playTone(100, 0.3, 'square', 0.1);
                    break;
            }
        }

            const supportDependency = Math.min(100, Math.round((telemetry.hintsUsed * 18) + (telemetry.movePurchases * 24) + (telemetry.lifePurchases * 30) + (Object.values(telemetry.powerupsUsed).reduce((sum, value) => sum + value, 0) * 6)));
            const perseverance = Math.max(0, Math.min(100, Math.round(70 + telemetry.retries * 8 - supportDependency * 0.25)));
            const flexibility = Math.max(0, Math.min(100, Math.round(55 + telemetry.modeChanges * 10 + (telemetry.powerupsUsed.shuffle || 0) * 6)));

            return {
                status,
                level_index: level,
                level_label: `Nivel ${level} · ${telemetry.currentLevelShape}`,
                area: currentMode === 'images' ? 'semantica' : currentMode === 'phonemes' ? 'fonologia' : 'lectoescritura',
                mode: currentMode,
                mode_label: getCurrentFamilyName(),
                score: Math.max(0, Math.min(100, levelEfficiency)),
                accuracy: tacticalAccuracy,
                raw_score: score,
                duration_seconds: Math.round(sessionDurationMs / 1000),
                average_time_ms: usedMoves ? Math.round(levelDurationMs / usedMoves) : levelDurationMs,
                total_time_ms: sessionDurationMs,
                total_swaps: telemetry.totalSwaps,
                valid_swaps: telemetry.validSwaps,
                invalid_swaps: telemetry.invalidSwaps,
                moves_remaining: moves,
                moves_used: usedMoves,
                move_efficiency: moveEfficiency,
                hints_used: telemetry.hintsUsed,
                retries: telemetry.retries,
                move_purchases: telemetry.movePurchases,
                life_purchases: telemetry.lifePurchases,
                completed_levels: telemetry.completedLevels.length,
                stars_earned: score >= starThresholds[2] ? 3 : score >= starThresholds[1] ? 2 : score > 0 ? 1 : 0,
                objective_progress: objectiveSummary.progress,
                objectives_completed: objectiveSummary.completed,
                objectives_total: objectiveSummary.count,
                powerups_used_total: Object.values(telemetry.powerupsUsed).reduce((sum, value) => sum + value, 0),
                powerups_used_breakdown: telemetry.powerupsUsed,
                board_complexity: boardComplexity,
                blocked_cells: blockedCells,
                ice_cells: iceCells,
                support_dependency: supportDependency,
                perseverance_index: perseverance,
                flexibility_index: flexibility,
                labels_large: labelsLarge,
                labels_small: labelsSmall,
                worked_dimensions: labelsSmall,
                summary: `${getCurrentFamilyName()} · nivel ${level} · ${objectiveSummary.progress}% objetivos · ${tacticalAccuracy}% precision`,
                clinical_summary: `Modo ${getCurrentFamilyName()}. Precision tactica ${tacticalAccuracy}%, progreso de objetivos ${objectiveSummary.progress}%, ${telemetry.invalidSwaps} intercambios no validos, dependencia de apoyo ${supportDependency}% y perseverancia ${perseverance}%.`,
                next_focus: telemetry.invalidSwaps > telemetry.validSwaps ? 'Refuerzo de planificacion y anticipacion antes del intercambio.' : 'Aumentar complejidad manteniendo control de movimientos.',
                round_metrics: telemetry.completedLevels,
                visual_load: boardComplexity,
                executive_load: Math.min(100, 30 + level * 8 + blockedCells * 4),
                phonological_load: currentMode === 'phonemes' ? 82 : currentMode === 'syllables' ? 68 : currentMode === 'letters' ? 55 : 32,
                semantic_load: currentMode === 'images' ? 84 : 40
            };
        }

        function pushMeasurement(status = 'in_progress') {
            const payload = buildMeasurementPayload(status);
            window.__letraCrushMetrics = payload;
            localStorage.setItem('letra_crush_metrics_v1', JSON.stringify(payload));
            window.dispatchEvent(new CustomEvent('logopedia-measurement-updated', { detail: payload }));
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'logopedia-measurement', activity: 'poe-letra-crush', payload }, '*');
            }
            return payload;
        }

        function startLevelTelemetry() {
            const config = getLevelConfig();
            telemetry.currentLevelStartedAt = Date.now();
            telemetry.currentLevelInitialMoves = config.moves;
            telemetry.currentLevelShape = config.name;
            pushMeasurement('in_progress');
        }

        function finalizeLevelTelemetry(status) {
            const snapshot = buildMeasurementPayload(status);
            telemetry.completedLevels.push({
                level_index: snapshot.level_index,
                level_label: snapshot.level_label,
                score: snapshot.score,
                accuracy: snapshot.accuracy,
                duration_seconds: Math.round((Date.now() - telemetry.currentLevelStartedAt) / 1000),
                moves_used: snapshot.moves_used,
                objective_progress: snapshot.objective_progress,
                stars_earned: snapshot.stars_earned,
                status
            });
            pushMeasurement(status);
        }

        function getLevelConfig() {
            return LEVEL_SHAPES[Math.min(level - 1, LEVEL_SHAPES.length - 1)];
        }

        function initLevel() {
            const config = getLevelConfig();
            moves = config.moves;
            starThresholds = config.stars;

            // Set cell types from shape
            cellTypes = [];
            for (let r = 0; r < ROWS; r++) {
                cellTypes[r] = [];
                for (let c = 0; c < COLS; c++) {
                    cellTypes[r][c] = config.shape[r][c];
                }
            }

            // Set objectives
            const pieces = getCurrentPieces();
            objectives = {};
            const targetCount = Math.min(3, Math.floor((level + 1) / 2));
            for (let i = 0; i < targetCount; i++) {
                const piece = pieces[i % pieces.length];
                objectives[piece] = { current: 0, target: 8 + level };
            }

            document.getElementById('levelShape').textContent = config.name;
            updateObjectiveDisplay();
            updateProgress();
            startLevelTelemetry();
        }

        function updateObjectiveDisplay() {
            const container = document.getElementById('objectives');
            const emoji = isEmojiMode();
            container.innerHTML = '';
            for (const piece in objectives) {
                const obj = objectives[piece];
                const done = obj.current >= obj.target;
                const pieceIdx = getCurrentPieces().indexOf(piece);
                container.innerHTML += `
                    <div class="objective-item ${done ? 'done' : ''}">
                        <div class="objective-letter ${emoji ? 'is-emoji' : ''} piece-${pieceIdx}">${piece}</div>
                        <span class="objective-count">${Math.min(obj.current, obj.target)}/${obj.target}</span>
                    </div>
                `;
            }
        }

        function updateProgress() {
            const maxScore = starThresholds[2];
            const pct = Math.min(100, (score / maxScore) * 100);
            document.getElementById('progressFill').style.height = pct + '%';
            document.getElementById('star1').classList.toggle('earned', score >= starThresholds[0]);
            document.getElementById('star2').classList.toggle('earned', score >= starThresholds[1]);
            document.getElementById('star3').classList.toggle('earned', score >= starThresholds[2]);
        }

        function updateLives() {
            const container = document.getElementById('livesContainer');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                container.innerHTML += `<i class="fas fa-heart heart ${i >= lives ? 'empty' : ''}"></i>`;
            }
        }

        function updatePowerupCounts() {
            ['hammer', 'bomb', 'rocket', 'rainbow', 'shuffle'].forEach(p => {
                const btn = document.getElementById('pwr' + p.charAt(0).toUpperCase() + p.slice(1));
                const count = document.getElementById('pwr' + p.charAt(0).toUpperCase() + p.slice(1) + 'Count');
                count.textContent = powerups[p];
                btn.classList.toggle('disabled', powerups[p] <= 0);
            });
        }

        function createBoard() {
            const pieces = getCurrentPieces();
            board = [];
            specialCells = {};
            for (let row = 0; row < ROWS; row++) {
                board[row] = [];
                for (let col = 0; col < COLS; col++) {
                    const type = cellTypes[row][col];
                    if (type === 0 || type === 2) {
                        board[row][col] = null;
                    } else {
                        let piece;
                        do { piece = pieces[Math.floor(Math.random() * pieces.length)]; }
                        while (wouldMatch(row, col, piece));
                        board[row][col] = piece;
                    }
                }
            }
        }

        function wouldMatch(row, col, piece) {
            if (col >= 2) {
                const t1 = cellTypes[row][col-1], t2 = cellTypes[row][col-2];
                if (t1 !== 0 && t1 !== 2 && t2 !== 0 && t2 !== 2) {
                    if (board[row][col-1] === piece && board[row][col-2] === piece) return true;
                }
            }
            if (row >= 2) {
                const t1 = cellTypes[row-1]?.[col], t2 = cellTypes[row-2]?.[col];
                if (t1 !== 0 && t1 !== 2 && t2 !== 0 && t2 !== 2) {
                    if (board[row-1]?.[col] === piece && board[row-2]?.[col] === piece) return true;
                }
            }
            return false;
        }

        function renderBoard(animate = false) {
            const boardEl = document.getElementById('board');
            const pieces = getCurrentPieces();
            const emoji = isEmojiMode();
            boardEl.innerHTML = '';

            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    const type = cellTypes[row][col];

                    if (type === 0) {
                        // Hidden cell
                        cell.className = 'cell hidden-cell';
                    } else if (type === 2) {
                        // Blocked cell
                        cell.className = 'cell blocked-cell';
                    } else {
                        // Normal, ice1, or ice2
                        const piece = board[row][col];
                        const pieceIdx = pieces.indexOf(piece);
                        const special = specialCells[`${row},${col}`];

                        cell.className = `cell piece-${pieceIdx}`;
                        if (emoji) cell.classList.add('is-emoji');
                        if (special) cell.classList.add(special);
                        if (type === 3) cell.classList.add('ice-1');
                        if (type === 4) cell.classList.add('ice-2');

                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece-text';
                        pieceSpan.textContent = piece;
                        cell.appendChild(pieceSpan);

                        if (animate) {
                            cell.classList.add('dropping');
                            cell.style.animationDelay = `${(col + row * 0.15) * 0.03}s`;
                        }

                        cell.addEventListener('touchstart', handleTouchStart, { passive: false });
                        cell.addEventListener('touchmove', handleTouchMove, { passive: false });
                        cell.addEventListener('touchend', handleTouchEnd);
                        cell.addEventListener('mousedown', handleMouseDown);
                    }

                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    boardEl.appendChild(cell);
                }
            }

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function isPlayableCell(row, col) {
            const type = cellTypes[row]?.[col];
            return type && type !== 0 && type !== 2;
        }

        function getCellFromEvent(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const element = document.elementFromPoint(x, y);
            if (element?.dataset?.row !== undefined) {
                const row = parseInt(element.dataset.row);
                const col = parseInt(element.dataset.col);
                if (isPlayableCell(row, col)) {
                    return { row, col, element };
                }
            }
            if (element?.parentElement?.dataset?.row !== undefined) {
                const row = parseInt(element.parentElement.dataset.row);
                const col = parseInt(element.parentElement.dataset.col);
                if (isPlayableCell(row, col)) {
                    return { row, col, element: element.parentElement };
                }
            }
            return null;
        }

        function handleTouchStart(e) {
            if (isProcessing) return;
            e.preventDefault();
            initAudio();
            const cell = getCellFromEvent(e);
            if (!cell) return;
            if (activePowerup) { usePowerupOnCell(cell.row, cell.col); return; }
            isDragging = true;
            dragStartCell = cell;
            dragStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            cell.element.classList.add('dragging');
        }

        function handleTouchMove(e) {
            if (!isDragging || isProcessing) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - dragStartPos.x;
            const dy = e.touches[0].clientY - dragStartPos.y;
            const threshold = 25;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                let tr = dragStartCell.row, tc = dragStartCell.col;
                if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
                else tr += dy > 0 ? 1 : -1;
                if (isPlayableCell(tr, tc)) {
                    isDragging = false;
                    dragStartCell.element.classList.remove('dragging');
                    trySwap(dragStartCell.row, dragStartCell.col, tr, tc);
                }
            }
        }

        function handleTouchEnd() {
            if (dragStartCell?.element) dragStartCell.element.classList.remove('dragging');
            isDragging = false;
            dragStartCell = null;
        }

        function handleMouseDown(e) {
            if (isProcessing) return;
            e.preventDefault();
            initAudio();
            const cell = getCellFromEvent(e);
            if (!cell) return;
            if (activePowerup) { usePowerupOnCell(cell.row, cell.col); return; }
            isDragging = true;
            dragStartCell = cell;
            dragStartPos = { x: e.clientX, y: e.clientY };
            cell.element.classList.add('dragging');
        }

        function handleMouseMove(e) {
            if (!isDragging || isProcessing || !dragStartCell) return;
            const dx = e.clientX - dragStartPos.x;
            const dy = e.clientY - dragStartPos.y;
            const threshold = 20;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                let tr = dragStartCell.row, tc = dragStartCell.col;
                if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
                else tr += dy > 0 ? 1 : -1;
                if (isPlayableCell(tr, tc)) {
                    isDragging = false;
                    dragStartCell.element.classList.remove('dragging');
                    trySwap(dragStartCell.row, dragStartCell.col, tr, tc);
                    dragStartCell = null;
                }
            }
        }

        function handleMouseUp() {
            if (dragStartCell?.element) dragStartCell.element.classList.remove('dragging');
            isDragging = false;
            dragStartCell = null;
        }

        function activatePowerup(type) {
            if (isProcessing || powerups[type] <= 0) return;
            initAudio();
            if (type === 'shuffle') {
                telemetry.powerupsUsed.shuffle++;
                powerups.shuffle--;
                updatePowerupCounts();
                shuffleBoard();
                return;
            }
            document.querySelectorAll('.powerup-btn').forEach(b => b.classList.remove('active'));
            if (activePowerup === type) {
                activePowerup = null;
            } else {
                activePowerup = type;
                document.getElementById('pwr' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
            }
        }

        function usePowerupOnCell(row, col) {
            if (!activePowerup) return false;
            telemetry.powerupsUsed[activePowerup] = (telemetry.powerupsUsed[activePowerup] || 0) + 1;
            powerups[activePowerup]--;
            updatePowerupCounts();
            isProcessing = true;
            const toRemove = [];

            if (activePowerup === 'hammer') {
                if (isPlayableCell(row, col)) toRemove.push({ row, col });
                playSound('match');
            } else if (activePowerup === 'bomb') {
                playSound('explosion');
                for (let r = row - 1; r <= row + 1; r++) {
                    for (let c = col - 1; c <= col + 1; c++) {
                        if (isPlayableCell(r, c)) toRemove.push({ row: r, col: c });
                    }
                }
            } else if (activePowerup === 'rocket') {
                playSound('special');
                for (let c = 0; c < COLS; c++) if (isPlayableCell(row, c)) toRemove.push({ row, col: c });
                for (let r = 0; r < ROWS; r++) if (r !== row && isPlayableCell(r, col)) toRemove.push({ row: r, col });
            } else if (activePowerup === 'rainbow') {
                playSound('rainbow');
                const targetPiece = board[row][col];
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] === targetPiece && isPlayableCell(r, c)) toRemove.push({ row: r, col: c });
                    }
                }
            }

            activePowerup = null;
            document.querySelectorAll('.powerup-btn').forEach(b => b.classList.remove('active'));
            if (toRemove.length > 0) { combo = 1; processRemoval(toRemove); }
            else isProcessing = false;
            return true;
        }

        function trySwap(r1, c1, r2, c2) {
            playSound('swap');
            telemetry.totalSwaps++;
            const spec1 = specialCells[`${r1},${c1}`];
            const spec2 = specialCells[`${r2},${c2}`];

            // Swap pieces
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];

            // Swap specials
            const tmpSpec1 = specialCells[`${r1},${c1}`];
            const tmpSpec2 = specialCells[`${r2},${c2}`];
            delete specialCells[`${r1},${c1}`];
            delete specialCells[`${r2},${c2}`];
            if (tmpSpec1) specialCells[`${r2},${c2}`] = tmpSpec1;
            if (tmpSpec2) specialCells[`${r1},${c1}`] = tmpSpec2;

            const matches = findAllMatches();

            if (spec1 === 'rainbow' || spec2 === 'rainbow') {
                telemetry.validSwaps++;
                moves--;
                isProcessing = true;
                combo = 0;
                const rainbowPos = spec1 === 'rainbow' ? { r: r1, c: c1 } : { r: r2, c: c2 };
                const otherPos = spec1 === 'rainbow' ? { r: r2, c: c2 } : { r: r1, c: c1 };
                const targetPiece = board[otherPos.r][otherPos.c];
                const toRemove = [];
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] === targetPiece && isPlayableCell(r, c)) toRemove.push({ row: r, col: c });
                    }
                }
                toRemove.push({ row: rainbowPos.r, col: rainbowPos.c });
                showPopup('¡ARCOÍRIS!', '#ffd700');
                playSound('rainbow');
                updateStats();
                renderBoard();
                setTimeout(() => processRemoval(toRemove), 150);
                return;
            }

            if (matches.length > 0) {
                telemetry.validSwaps++;
                moves--;
                isProcessing = true;
                combo = 0;
                updateStats();
                renderBoard();
                setTimeout(() => processMatches(matches), 150);
            } else {
                telemetry.invalidSwaps++;
                playSound('invalid');
                // Swap back
                [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
                delete specialCells[`${r1},${c1}`];
                delete specialCells[`${r2},${c2}`];
                if (tmpSpec1) specialCells[`${r1},${c1}`] = tmpSpec1;
                if (tmpSpec2) specialCells[`${r2},${c2}`] = tmpSpec2;

                const cells = document.querySelectorAll('.cell');
                cells[r1 * COLS + c1]?.classList.add('invalid');
                cells[r2 * COLS + c2]?.classList.add('invalid');
                setTimeout(() => {
                    cells[r1 * COLS + c1]?.classList.remove('invalid');
                    cells[r2 * COLS + c2]?.classList.remove('invalid');
                }, 400);
                pushMeasurement('in_progress');
            }
        }

        function findAllMatches() {
            const matches = [];
            // Horizontal
            for (let row = 0; row < ROWS; row++) {
                let col = 0;
                while (col < COLS) {
                    if (!isPlayableCell(row, col) || !board[row][col]) { col++; continue; }
                    const piece = board[row][col];
                    let end = col;
                    while (end + 1 < COLS && isPlayableCell(row, end + 1) && board[row][end + 1] === piece) end++;
                    if (end - col >= 2) {
                        matches.push({
                            cells: Array.from({ length: end - col + 1 }, (_, i) => ({ row, col: col + i })),
                            piece, type: 'horizontal', length: end - col + 1
                        });
                    }
                    col = end + 1;
                }
            }
            // Vertical
            for (let col = 0; col < COLS; col++) {
                let row = 0;
                while (row < ROWS) {
                    if (!isPlayableCell(row, col) || !board[row][col]) { row++; continue; }
                    const piece = board[row][col];
                    let end = row;
                    while (end + 1 < ROWS && isPlayableCell(end + 1, col) && board[end + 1][col] === piece) end++;
                    if (end - row >= 2) {
                        matches.push({
                            cells: Array.from({ length: end - row + 1 }, (_, i) => ({ row: row + i, col })),
                            piece, type: 'vertical', length: end - row + 1
                        });
                    }
                    row = end + 1;
                }
            }
            return matches;
        }

        function processMatches(matches) {
            combo++;
            const allCells = new Map();
            const specialToCreate = [];

            matches.forEach(match => {
                match.cells.forEach(c => allCells.set(`${c.row},${c.col}`, { ...c, piece: board[c.row][c.col] }));
            });

            playSound('match');
            if (combo > 1) playSound('combo');

            // Determine special pieces to create
            matches.forEach(match => {
                const len = match.length;
                let hasIntersection = false, intersectionPoint = null;
                matches.forEach(other => {
                    if (other === match) return;
                    match.cells.forEach(c1 => {
                        other.cells.forEach(c2 => {
                            if (c1.row === c2.row && c1.col === c2.col) {
                                hasIntersection = true;
                                intersectionPoint = c1;
                            }
                        });
                    });
                });

                if (hasIntersection && intersectionPoint) {
                    if (!specialToCreate.find(s => s.row === intersectionPoint.row && s.col === intersectionPoint.col)) {
                        specialToCreate.push({ row: intersectionPoint.row, col: intersectionPoint.col, type: 'wrapped', piece: match.piece });
                    }
                } else if (len >= 5) {
                    const mid = match.cells[Math.floor(len / 2)];
                    specialToCreate.push({ row: mid.row, col: mid.col, type: 'rainbow', piece: match.piece });
                } else if (len === 4) {
                    const mid = match.cells[1];
                    specialToCreate.push({ row: mid.row, col: mid.col, type: match.type === 'horizontal' ? 'striped-h' : 'striped-v', piece: match.piece });
                }
            });

            if (specialToCreate.length > 0) playSound('special');

            // Find triggered specials
            const triggeredSpecials = [];
            allCells.forEach((cell, key) => {
                if (specialCells[key]) triggeredSpecials.push({ row: cell.row, col: cell.col, type: specialCells[key] });
            });

            // Calculate points
            let points = allCells.size * 10;
            if (allCells.size >= 4) points *= 1.5;
            if (allCells.size >= 5) points *= 2;
            points *= combo;
            score += Math.floor(points);

            // Update objectives and break ice
            allCells.forEach(cell => {
                if (objectives[cell.piece]) objectives[cell.piece].current++;
                breakIce(cell.row, cell.col);
            });

            // Show word
            const pieceCounts = {};
            allCells.forEach(cell => { pieceCounts[cell.piece] = (pieceCounts[cell.piece] || 0) + 1; });
            const mainPiece = Object.entries(pieceCounts).sort((a, b) => b[1] - a[1])[0][0];
            showWord(mainPiece);

            // Show popups
            if (combo > 1) showPopup(`¡COMBO x${combo}!`, '#ff6b6b');
            if (allCells.size >= 5) showPopup('¡INCREÍBLE!', '#a66cff');
            else if (allCells.size >= 4) showPopup('¡GENIAL!', '#ffd93d');
            if (specialToCreate.length > 0) showPopup('¡ESPECIAL!', '#2ecc71');

            createParticles(Array.from(allCells.values()));
            updateStats();
            updateObjectiveDisplay();
            updateProgress();

            // Animate matching cells
            const cellEls = document.querySelectorAll('.cell');
            allCells.forEach(cell => {
                const idx = cell.row * COLS + cell.col;
                cellEls[idx]?.classList.add('matching');
            });

            setTimeout(() => {
                // Remove matched cells
                allCells.forEach((cell, key) => {
                    board[cell.row][cell.col] = null;
                    delete specialCells[key];
                });

                // Create special pieces
                specialToCreate.forEach(spec => {
                    board[spec.row][spec.col] = spec.piece;
                    specialCells[`${spec.row},${spec.col}`] = spec.type;
                });

                // Handle triggered specials
                const extraCells = [];
                triggeredSpecials.forEach(spec => {
                    if (spec.type === 'striped-h') {
                        playSound('special');
                        for (let c = 0; c < COLS; c++) if (board[spec.row]?.[c] && isPlayableCell(spec.row, c)) extraCells.push({ row: spec.row, col: c });
                    } else if (spec.type === 'striped-v') {
                        playSound('special');
                        for (let r = 0; r < ROWS; r++) if (board[r]?.[spec.col] && isPlayableCell(r, spec.col)) extraCells.push({ row: r, col: spec.col });
                    } else if (spec.type === 'wrapped') {
                        playSound('explosion');
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                const nr = spec.row + dr, nc = spec.col + dc;
                                if (board[nr]?.[nc] && isPlayableCell(nr, nc)) extraCells.push({ row: nr, col: nc });
                            }
                        }
                    }
                });

                if (extraCells.length > 0) {
                    extraCells.forEach(({ row, col }) => {
                        const piece = board[row][col];
                        if (piece && objectives[piece]) objectives[piece].current++;
                        breakIce(row, col);
                        board[row][col] = null;
                        delete specialCells[`${row},${col}`];
                    });
                    score += extraCells.length * 15 * combo;
                    updateStats();
                    updateObjectiveDisplay();
                    updateProgress();
                    createParticles(extraCells);
                }

                playSound('drop');
                dropCells();
                fillEmptyCells();
                renderBoard();

                setTimeout(() => {
                    const newMatches = findAllMatches();
                    if (newMatches.length > 0) processMatches(newMatches);
                    else { isProcessing = false; checkWinLose(); }
                }, 250);
            }, 300);
        }

        function processRemoval(cells) {
            const uniqueCells = [];
            const seen = new Set();
            cells.forEach(({ row, col }) => {
                const key = `${row},${col}`;
                if (!seen.has(key) && board[row]?.[col] && isPlayableCell(row, col)) {
                    seen.add(key);
                    uniqueCells.push({ row, col });
                }
            });

            let points = uniqueCells.length * 10 * combo;
            score += points;

            uniqueCells.forEach(({ row, col }) => {
                const piece = board[row][col];
                if (objectives[piece]) objectives[piece].current++;
                breakIce(row, col);
            });

            updateStats();
            updateObjectiveDisplay();
            updateProgress();
            createParticles(uniqueCells);

            const cellEls = document.querySelectorAll('.cell');
            uniqueCells.forEach(({ row, col }) => {
                const idx = row * COLS + col;
                if (cellEls[idx]) cellEls[idx].classList.add('matching');
                board[row][col] = null;
                delete specialCells[`${row},${col}`];
            });

            setTimeout(() => {
                playSound('drop');
                dropCells();
                fillEmptyCells();
                renderBoard();

                setTimeout(() => {
                    const newMatches = findAllMatches();
                    if (newMatches.length > 0) {
                        combo++;
                        processMatches(newMatches);
                    } else {
                        isProcessing = false;
                        checkWinLose();
                    }
                }, 250);
            }, 350);
        }

        function breakIce(row, col) {
            const type = cellTypes[row][col];
            if (type === 4) {
                cellTypes[row][col] = 3;
                playSound('ice');
            } else if (type === 3) {
                cellTypes[row][col] = 1;
                playSound('ice');
            }
        }

        function dropCells() {
            for (let col = 0; col < COLS; col++) {
                let writeRow = ROWS - 1;
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (!isPlayableCell(row, col)) continue;
                    if (board[row][col] !== null) {
                        if (row !== writeRow) {
                            // Find next playable row
                            while (writeRow > row && !isPlayableCell(writeRow, col)) writeRow--;
                            if (writeRow !== row && isPlayableCell(writeRow, col)) {
                                board[writeRow][col] = board[row][col];
                                board[row][col] = null;
                                const oldKey = `${row},${col}`, newKey = `${writeRow},${col}`;
                                if (specialCells[oldKey]) {
                                    specialCells[newKey] = specialCells[oldKey];
                                    delete specialCells[oldKey];
                                }
                            }
                        }
                        writeRow--;
                        while (writeRow >= 0 && !isPlayableCell(writeRow, col)) writeRow--;
                    }
                }
            }
        }

        function fillEmptyCells() {
            const pieces = getCurrentPieces();
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (isPlayableCell(row, col) && board[row][col] === null) {
                        board[row][col] = pieces[Math.floor(Math.random() * pieces.length)];
                    }
                }
            }
        }

        function checkWinLose() {
            let won = true;
            for (const piece in objectives) {
                if (objectives[piece].current < objectives[piece].target) { won = false; break; }
            }
            if (won) { setTimeout(showLevelComplete, 500); return; }
            if (moves <= 0) { setTimeout(showGameOver, 500); return; }
            if (!hasValidMoves()) shuffleBoard();
        }

        function hasValidMoves() {
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (!isPlayableCell(row, col)) continue;
                    // Check right
                    if (col < COLS - 1 && isPlayableCell(row, col + 1)) {
                        swap(row, col, row, col + 1);
                        if (findAllMatches().length > 0) { swap(row, col, row, col + 1); return true; }
                        swap(row, col, row, col + 1);
                    }
                    // Check down
                    if (row < ROWS - 1 && isPlayableCell(row + 1, col)) {
                        swap(row, col, row + 1, col);
                        if (findAllMatches().length > 0) { swap(row, col, row + 1, col); return true; }
                        swap(row, col, row + 1, col);
                    }
                }
            }
            return false;
        }

        function swap(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        }

        function findHint() {
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (!isPlayableCell(row, col)) continue;
                    if (col < COLS - 1 && isPlayableCell(row, col + 1)) {
                        swap(row, col, row, col + 1);
                        if (findAllMatches().length > 0) { swap(row, col, row, col + 1); return [{ row, col }, { row, col: col + 1 }]; }
                        swap(row, col, row, col + 1);
                    }
                    if (row < ROWS - 1 && isPlayableCell(row + 1, col)) {
                        swap(row, col, row + 1, col);
                        if (findAllMatches().length > 0) { swap(row, col, row + 1, col); return [{ row, col }, { row: row + 1, col }]; }
                        swap(row, col, row + 1, col);
                    }
                }
            }
            return null;
        }

        function showHint() {
            if (isProcessing) return;
            telemetry.hintsUsed++;
            const hint = findHint();
            if (hint) {
                const cells = document.querySelectorAll('.cell');
                hint.forEach(({ row, col }) => cells[row * COLS + col]?.classList.add('hint'));
                setTimeout(() => document.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint')), 1200);
            }
            pushMeasurement('in_progress');
        }

        function shuffleBoard() {
            const piecesOnBoard = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (isPlayableCell(r, c) && board[r][c]) piecesOnBoard.push(board[r][c]);
                }
            }
            for (let i = piecesOnBoard.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [piecesOnBoard[i], piecesOnBoard[j]] = [piecesOnBoard[j], piecesOnBoard[i]];
            }
            let idx = 0;
            const pieces = getCurrentPieces();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (isPlayableCell(r, c)) board[r][c] = piecesOnBoard[idx++] || pieces[0];
                }
            }
            specialCells = {};
            renderBoard(true);
            setTimeout(() => {
                const matches = findAllMatches();
                if (matches.length > 0) { isProcessing = true; combo = 0; processMatches(matches); }
                else if (!hasValidMoves()) shuffleBoard();
            }, 350);
        }

        function showWord(piece) {
            const words = getCurrentWords()[piece];
            if (words) {
                const w = words[Math.floor(Math.random() * words.length)];
                document.getElementById('wordText').textContent = w.word;
                document.getElementById('wordMeaning').textContent = w.meaning;
            }
        }

        function showPopup(text, color) {
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.textContent = text;
            popup.style.color = color;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        function createParticles(cells) {
            const container = document.getElementById('particles');
            const cellEls = document.querySelectorAll('.cell');
            const pieces = getCurrentPieces();
            cells.forEach(({ row, col }) => {
                const idx = row * COLS + col;
                const cell = cellEls[idx];
                if (!cell) return;
                const rect = cell.getBoundingClientRect();
                const piece = board[row]?.[col];
                const pieceIdx = pieces.indexOf(piece);
                const color = PIECE_COLORS[pieceIdx >= 0 ? pieceIdx : 0];
                for (let i = 0; i < 6; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.width = (5 + Math.random() * 5) + 'px';
                    p.style.height = p.style.width;
                    p.style.background = color;
                    p.style.left = rect.left + rect.width / 2 + (Math.random() - 0.5) * 40 + 'px';
                    p.style.top = rect.top + rect.height / 2 + 'px';
                    container.appendChild(p);
                    setTimeout(() => p.remove(), 600);
                }
            });
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('levelNum').textContent = level;
            document.getElementById('moves').textContent = moves;
            document.getElementById('coins').textContent = coins;
            pushMeasurement('in_progress');
        }

        function showLevelComplete() {
            finalizeLevelTelemetry('completed');
            playSound('levelComplete');
            const starsEarned = score >= starThresholds[2] ? 3 : score >= starThresholds[1] ? 2 : 1;
            const reward = 50 + (starsEarned * 25);
            coins += Math.floor(reward);
            powerups.hammer++;
            if (starsEarned >= 2) powerups.bomb++;
            if (starsEarned >= 3) powerups.rainbow++;

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-title">🎉 ¡NIVEL ${level} COMPLETADO!</div>
                    <div class="modal-stars">
                        <i class="fas fa-star modal-star ${starsEarned >= 1 ? 'earned' : ''}"></i>
                        <i class="fas fa-star modal-star ${starsEarned >= 2 ? 'earned' : ''}"></i>
                        <i class="fas fa-star modal-star ${starsEarned >= 3 ? 'earned' : ''}"></i>
                    </div>
                    <div class="modal-stats">
                        <div><div class="modal-stat-value">${score}</div><div class="modal-stat-label">Puntos</div></div>
                        <div><div class="modal-stat-value">${moves}</div><div class="modal-stat-label">Sobran</div></div>
                    </div>
                    <div class="modal-rewards">
                        💰 +${Math.floor(reward)} | 🔨 +1 ${starsEarned >= 2 ? '| 💣 +1' : ''} ${starsEarned >= 3 ? '| ⭐ +1' : ''}
                    </div>
                    <button class="modal-btn" onclick="this.closest('.modal-overlay').remove(); nextLevel();">Siguiente →</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showGameOver() {
            finalizeLevelTelemetry('failed');
            playSound('gameOver');
            lives--;
            updateLives();
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            if (lives > 0) {
                modal.innerHTML = `
                    <div class="modal">
                        <div class="modal-title">😢 ¡Sin movimientos!</div>
                        <div style="margin:10px 0">Te quedan ${lives} ❤️</div>
                        <button class="modal-btn" onclick="this.closest('.modal-overlay').remove(); retryLevel();">Reintentar</button>
                        <button class="modal-btn secondary" onclick="this.closest('.modal-overlay').remove(); buyMoves();">+5 Mov (50 🪙)</button>
                    </div>
                `;
            } else {
                modal.innerHTML = `
                    <div class="modal">
                        <div class="modal-title">💔 ¡Sin vidas!</div>
                        <button class="modal-btn" onclick="this.closest('.modal-overlay').remove(); buyLives();">5 vidas (100 🪙)</button>
                        <button class="modal-btn secondary" onclick="this.closest('.modal-overlay').remove(); newGame();">Nuevo Juego</button>
                    </div>
                `;
            }
            document.body.appendChild(modal);
        }

        function buyMoves() {
            if (coins >= 50) { telemetry.movePurchases++; coins -= 50; moves += 5; updateStats(); }
            else showPopup('¡Sin monedas!', '#e74c3c');
        }

        function buyLives() {
            if (coins >= 100) { telemetry.lifePurchases++; coins -= 100; lives = 5; updateLives(); updateStats(); retryLevel(); }
            else showPopup('¡Sin monedas!', '#e74c3c');
        }

        function nextLevel() {
            level++;
            score = 0;
            if (currentMode === 'images') {
                GAME_MODES.images.currentFamily = (GAME_MODES.images.currentFamily + 1) % GAME_MODES.images.families.length;
                updateTitle();
            }
            initLevel();
            createBoard();
            updateStats();
            updatePowerupCounts();
            renderBoard(true);
        }

        function retryLevel() {
            telemetry.retries++;
            score = 0;
            initLevel();
            createBoard();
            updateStats();
            renderBoard(true);
        }

        function newGame() {
            telemetry = createTelemetry();
            level = 1;
            score = 0;
            lives = 5;
            coins = 100;
            powerups = { hammer: 3, bomb: 2, rocket: 2, rainbow: 1, shuffle: 2 };
            initLevel();
            createBoard();
            updateStats();
            updateLives();
            updatePowerupCounts();
            updateTitle();
            renderBoard(true);
            pushMeasurement('in_progress');
        }

        // Initialize game
        newGame();

        // Initialize and unlock audio on first interaction (important for Mac/Safari)
        function handleFirstInteraction() {
            initAudio();
            unlockAudio();
        }

        // Multiple event types for better Mac/Safari compatibility
        ['click', 'touchstart', 'touchend', 'mousedown', 'keydown'].forEach(event => {
            document.addEventListener(event, handleFirstInteraction, { once: true, passive: true });
        });

        // Also try to resume audio context periodically if it gets suspended
        setInterval(() => {
            if (audioCtx && audioCtx.state === 'suspended' && soundEnabled) {
                audioCtx.resume();
            }
        }, 1000);
    </script>
