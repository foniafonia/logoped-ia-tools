        // Función para procesar texto y resaltar R o RR
        function processText(text) {
            // Procesar palabra por palabra preservando espacios y puntuación
            return text.replace(/\b(\w*[rR]{1,2}\w*)\b/g, (match) => {
                const lowerMatch = match.toLowerCase();
                const rrIndex = lowerMatch.indexOf('rr');

                if (rrIndex !== -1) {
                    // Tiene RR (doble R)
                    const before = match.substring(0, rrIndex);
                    const rr = match.substring(rrIndex, rrIndex + 2);
                    const after = match.substring(rrIndex + 2);
                    return `${before}<span class="r-letter">${rr.toUpperCase()}</span>${after}`;
                } else if (lowerMatch.charAt(0) === 'r') {
                    // Empieza con R simple
                    const r = match.charAt(0);
                    const rest = match.substring(1);
                    return `<span class="r-letter">${r.toUpperCase()}</span>${rest}`;
                }

                return match;
            });
        }

        // Función para procesar palabras y resaltar R o RR
        function processWord(word) {
            const lowerWord = word.toLowerCase();

            // Buscar RR en cualquier posición
            const rrIndex = lowerWord.indexOf('rr');

            if (rrIndex !== -1) {
                // Tiene RR (doble R)
                const before = word.substring(0, rrIndex);
                const after = word.substring(rrIndex + 2);
                return `${before}<span class="separator">-</span><span class="r-letter">RR</span><span class="separator">-</span>${after}`;
            } else if (lowerWord.charAt(0) === 'r') {
                // Empieza con R simple
                const secondChar = word.charAt(1);
                const remaining = word.substring(2);
                return `<span class="r-letter">R</span><span class="separator">-</span>${secondChar.toUpperCase()}<span class="separator">-</span>${remaining}`;
            } else if (lowerWord.charAt(lowerWord.length - 1) === 'r') {
                // Termina con R simple
                const beforeR = word.substring(0, word.length - 1);
                const r = word.charAt(word.length - 1);
                return `${beforeR}<span class="separator">-</span><span class="r-letter">${r.toUpperCase()}</span>`;
            }

            return word;
        }

        // Función para crear tarjeta de palabra
        function createWordCard(word, index) {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `<div class="word-text">${processWord(word)}</div>`;
            card.style.animationDelay = `${index * 0.1}s`;

            // Click para reproducir palabra
            card.addEventListener('click', () => {
                card.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    card.style.transform = '';
                }, 300);
            });

            return card;
        }

        // Mostrar página
        function showPage(pageNum) {
            // Actualizar botones
            const buttons = document.querySelectorAll('.page-btn');
            buttons.forEach((btn, index) => {
                if (index + 1 === pageNum) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Mostrar contenido de página
            const pages = document.querySelectorAll('.page-content');
            pages.forEach((page, index) => {
                if (index + 1 === pageNum) {
                    page.classList.add('active');
                } else {
                    page.classList.remove('active');
                }
            });

            currentPage = pageNum;
            resetView();
        }

        // Cambiar modo de visualización
        function setMode(mode) {
            currentMode = mode;

            // Actualizar opciones activas
            const options = document.querySelectorAll('.control-option[data-mode]');
            options.forEach(opt => opt.classList.remove('active'));
            const activeOption = document.querySelector(`.control-option[data-mode="${mode}"]`);
            if (activeOption) {
                activeOption.classList.add('active');
            }

            const cards = document.querySelectorAll('.page-content.active .word-card, .page-content.active .tongue-twister-card');

            // Limpiar animaciones y pelotas previas
            cards.forEach(card => {
                card.classList.remove('fade-in', 'slide-in', 'karaoke-mode');
                card.style.opacity = '1';
                const existingBall = card.querySelector('.soccer-ball');
                if (existingBall) {
                    existingBall.remove();
                }
                const wordText = card.querySelector('.word-text, .tongue-twister-text');
                if (wordText) {
                    wordText.classList.remove('karaoke-mode', 'karaoke-rtl-mode');
                }
            });

            if (mode === 'word-by-word') {
                playWordByWord();
            } else if (mode === 'slide') {
                playSlide();
            } else if (mode === 'karaoke') {
                playKaraoke();
            } else if (mode === 'karaoke-rtl') {
                playKaraokeRTL();
            } else if (mode === 'soccer') {
                playSoccer();
            }
        }

        // Modo palabra por palabra

            const cards = document.querySelectorAll('.page-content.active .word-card, .page-content.active .tongue-twister-card');

                setTimeout(() => {

                card.style.opacity = '0';

            const cards = document.querySelectorAll('.page-content.active .word-card, .page-content.active .tongue-twister-card');

        // Modo pelota de fútbol (derecha a izquierda)
        function playSoccer() {
            const cards = document.querySelectorAll('.page-content.active .word-card, .page-content.active .tongue-twister-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    const ball = document.createElement('div');

                    ball.textContent = '⚽';
                    card.appendChild(ball);

                    // Remover la pelota después de la animación
                    setTimeout(() => {
                        ball.remove();
                    }, 3500);
                }, index * 500);
            });
        }

        // Toggle modo arcoíris
        function toggleRainbow() {
            rainbowMode = !rainbowMode;
            const container = document.querySelector('.page-content.active');

            if (rainbowMode) {
                container.classList.add('rainbow-mode');
                option.classList.add('active');
            } else {
                container.classList.remove('rainbow-mode');
                option.classList.remove('active');
            }
        }

        // Toggle controles
        function toggleControls() {
            const menu = document.getElementById('controlMenu');
            menu.classList.toggle('visible');
        }

        // Reiniciar vista
        function resetView() {
            if (currentPage === 1) {
                renderWordsPage1();
            } else if (currentPage === 2) {
                renderLogotomas();
            } else if (currentPage === 3) {
                renderRRIntermedia();
            } else if (currentPage === 4) {
                renderLogotomasRR();
            } else if (currentPage === 5) {
                renderRFinal();
            } else if (currentPage === 6) {
                renderFrases();
            } else if (currentPage === 7) {
                renderAdivinanzas();
            } else if (currentPage === 8) {
                renderTrabalenguas();
            }

            rainbowMode = false;
            const containers = document.querySelectorAll('.page-content');
            containers.forEach(container => {
                container.classList.remove('rainbow-mode');
            });

            // Resetear opción arcoíris
            const rainbowOption = document.getElementById('rainbowOption');
            if (rainbowOption) {
                rainbowOption.classList.remove('active');
            }

            // Resetear modo normal
            currentMode = 'normal';
            const options = document.querySelectorAll('.control-option[data-mode]');
            options.forEach(opt => opt.classList.remove('active'));
            const normalOption = document.querySelector('.control-option[data-mode="normal"]');
            if (normalOption) {
                normalOption.classList.add('active');
            }
        }

        // Detectar modo oscuro
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Cerrar menú al hacer clic fuera
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('controlMenu');
            const controls = document.getElementById('floatingControls');

            if (!controls.contains(event.target)) {
                menu.classList.remove('visible');
            }

        renderLogotomasRR();
        renderRFinal();
        renderFrases();
