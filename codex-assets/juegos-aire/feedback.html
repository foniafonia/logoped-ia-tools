<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Feedback recibido · Juegos en el aire</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142033;
      --muted: #5c6878;
      --line: rgba(20, 32, 51, .14);
      --panel: rgba(255, 255, 255, .92);
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #f59e0b;
      --red: #ef4444;
      --violet: #7c3aed;
      --cyan: #0891b2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.88) 0 92px, transparent 94px),
        radial-gradient(circle at 88% 8%, rgba(255,255,255,.68) 0 132px, transparent 134px),
        linear-gradient(135deg, #dff7ff 0%, #fff3c4 43%, #dcfce7 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0 16px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 8px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.6rem);
      line-height: .95;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font-weight: 950;
      box-shadow: 0 12px 30px rgba(20, 32, 51, .1);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 14px;
    }

    .metric {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(20, 32, 51, .1);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 2rem;
      line-height: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 240px) minmax(180px, 240px);
      gap: 10px;
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 36px rgba(20, 32, 51, .1);
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font-weight: 750;
    }

    .state {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 850;
      text-align: center;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-left: 8px solid var(--accent, var(--blue));
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(20, 32, 51, .12);
    }

    .item.reviewed {
      opacity: .76;
    }

    .item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: grid;
      gap: 6px;
    }

    .title strong {
      font-size: clamp(1.15rem, 2vw, 1.55rem);
      line-height: 1.08;
    }

    .date {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 780;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent, var(--blue)) 14%, white);
      color: color-mix(in srgb, var(--accent, var(--blue)) 76%, #111827);
      font-size: .74rem;
      font-weight: 950;
    }

    .badge.status {
      background: #fff7ed;
      color: #9a3412;
    }

    .badge.status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .message {
      margin: 0;
      padding: 14px;
      border-radius: 8px;
      background: #fff;
      color: #1f2937;
      font-size: 1.08rem;
      font-weight: 760;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .detail {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .68);
    }

    .detail span {
      display: block;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 950;
      text-transform: uppercase;
    }

    .detail strong {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
      font-size: .94rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .actions button,
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 950;
      cursor: pointer;
    }

    .actions button:disabled {
      cursor: default;
      opacity: .65;
    }

    .actions .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid,
      .details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .shell {
        padding: 10px;
      }

      .summary-grid,
      .details {
        grid-template-columns: 1fr;
      }

      .item-head {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">Panel privado sencillo</span>
        <h1>Feedback recibido</h1>
      </div>
      <a class="back" href="./">Volver a juegos</a>
    </header>

    <section class="summary-grid" aria-label="Resumen">
      <div class="metric"><span>Total</span><strong id="totalMetric">0</strong></div>
      <div class="metric"><span>Pendientes</span><strong id="pendingMetric">0</strong></div>
      <div class="metric"><span>Revisados</span><strong id="reviewedMetric">0</strong></div>
      <div class="metric"><span>Último</span><strong id="latestMetric">-</strong></div>
    </section>

    <section class="toolbar" aria-label="Filtros">
      <input id="searchInput" type="search" placeholder="Buscar por mensaje, juego, contacto..." />
      <select id="appFilter">
        <option value="">Todos los juegos</option>
      </select>
      <select id="statusFilter">
        <option value="">Todos</option>
        <option value="pendiente">Pendientes</option>
        <option value="revisado">Revisados</option>
      </select>
    </section>

    <div class="state" id="stateBox">Cargando feedback...</div>
    <section class="list" id="feedbackList" aria-label="Listado de feedback"></section>
  </main>

  <script>
    const appNames = {
      'pintura-aire-colores': 'Pintura en el aire',
      'puzzle-agarre-aire': 'Puzzle con agarre real',
      'logopedizado-gestos-juego': 'Lengua Runner',
      'abecedario-magico': 'Abecedario Mágico',
      'constructor-silabas-aire': 'Constructor de sílabas',
      'escritura-aire-rotulador': 'Escritura en el aire',
      'sin-app': 'Sin juego indicado',
    };

    const typeNames = {
      fallo_camara: 'Fallo cámara/mano',
      mecanica: 'Mecánica confusa',
      contenido: 'Contenido/consigna',
      diseno: 'Diseño/accesibilidad',
      actividad_nueva: 'Actividad nueva',
      otro: 'Otro',
    };

    const sessionNames = {
      menos_2_min: 'Menos de 2 min',
      '2_5_min': '2-5 min',
      '5_10_min': '5-10 min',
      mas_10_min: 'Más de 10 min',
    };

    const accents = {
      'pintura-aire-colores': '#ef4444',
      'puzzle-agarre-aire': '#2563eb',
      'logopedizado-gestos-juego': '#16a34a',
      'abecedario-magico': '#7c3aed',
      'constructor-silabas-aire': '#0891b2',
      'escritura-aire-rotulador': '#f59e0b',
    };

    const list = document.querySelector('#feedbackList');
    const stateBox = document.querySelector('#stateBox');
    const searchInput = document.querySelector('#searchInput');
    const appFilter = document.querySelector('#appFilter');
    const statusFilter = document.querySelector('#statusFilter');
    const totalMetric = document.querySelector('#totalMetric');
    const pendingMetric = document.querySelector('#pendingMetric');
    const reviewedMetric = document.querySelector('#reviewedMetric');
    const latestMetric = document.querySelector('#latestMetric');
    let entries = [];

    function text(value, fallback = '-') {
      const clean = String(value || '').trim();
      return clean || fallback;
    }

    function statusOf(item) {
      return item.status === 'revisado' ? 'revisado' : 'pendiente';
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat('es-ES', {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(date);
    }

    function shortLatest(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return new Intl.DateTimeFormat('es-ES', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      }).format(date);
    }

    function formatElapsed(ms) {
      const value = Number(ms);
      if (!Number.isFinite(value) || value <= 0) return '-';
      const seconds = Math.round(value / 1000);
      if (seconds < 60) return `${seconds} s`;
      return `${Math.floor(seconds / 60)} min ${seconds % 60} s`;
    }

    function updateMetrics() {
      const pending = entries.filter((item) => statusOf(item) === 'pendiente').length;
      totalMetric.textContent = entries.length;
      pendingMetric.textContent = pending;
      reviewedMetric.textContent = entries.length - pending;
      latestMetric.textContent = shortLatest(entries[0]?.created_at);
    }

    function fillApps() {
      const current = appFilter.value;
      const apps = [...new Set(entries.map((item) => item.app || 'sin-app'))].sort();
      appFilter.innerHTML = '<option value="">Todos los juegos</option>';
      for (const app of apps) {
        const option = document.createElement('option');
        option.value = app;
        option.textContent = appNames[app] || app;
        appFilter.append(option);
      }
      appFilter.value = current;
    }

    function filteredEntries() {
      const term = searchInput.value.trim().toLowerCase();
      const app = appFilter.value;
      const status = statusFilter.value;
      return entries.filter((item) => {
        const haystack = [
          appNames[item.app] || item.app,
          typeNames[item.type] || item.type,
          item.message,
          item.contact,
          item.role,
          item.page,
        ].join(' ').toLowerCase();
        return (!term || haystack.includes(term)) &&
          (!app || item.app === app) &&
          (!status || statusOf(item) === status);
      });
    }

    function render() {
      updateMetrics();
      fillApps();
      const visible = filteredEntries();
      list.innerHTML = '';
      stateBox.hidden = visible.length > 0;

      if (!entries.length) {
        stateBox.textContent = 'Todavía no hay feedback recibido.';
        return;
      }

      if (!visible.length) {
        stateBox.textContent = 'No hay feedback que coincida con esos filtros.';
        return;
      }

      for (const item of visible) {
        const status = statusOf(item);
        const card = document.createElement('article');
        card.className = `item ${status === 'revisado' ? 'reviewed' : ''}`;
        card.style.setProperty('--accent', accents[item.app] || '#2563eb');
        card.innerHTML = `
          <div class="item-head">
            <div class="title">
              <strong>${appNames[item.app] || text(item.app, 'Juego sin indicar')}</strong>
              <span class="date">${formatDate(item.created_at)}</span>
            </div>
            <div class="badges">
              <span class="badge status ${status === 'revisado' ? 'ok' : ''}">${status === 'revisado' ? 'OK revisado' : 'Pendiente'}</span>
              <span class="badge">${typeNames[item.type] || text(item.type)}</span>
              <span class="badge">${sessionNames[item.sessionTime] || text(item.sessionTime)}</span>
            </div>
          </div>
          <p class="message"></p>
          <div class="details">
            <div class="detail"><span>Quién</span><strong>${text(item.role)}</strong></div>
            <div class="detail"><span>Contacto</span><strong>${text(item.contact, 'No dejó contacto')}</strong></div>
            <div class="detail"><span>Tiempo real en página</span><strong>${formatElapsed(item.elapsedMs)}</strong></div>
            <div class="detail"><span>Página</span><strong>${text(item.page)}</strong></div>
            <div class="detail"><span>Revisado</span><strong>${item.reviewed_at ? formatDate(item.reviewed_at) : 'No'}</strong></div>
            <div class="detail"><span>ID</span><strong>${text(item.id)}</strong></div>
          </div>
          <div class="actions">
            <a class="secondary" href="${item.page || './'}" target="_blank" rel="noreferrer">Abrir contexto</a>
            <button type="button" ${status === 'revisado' ? 'disabled' : ''}>Dar OK</button>
          </div>
        `;
        card.querySelector('.message').textContent = text(item.message, 'Sin mensaje');
        card.querySelector('button').addEventListener('click', () => markReviewed(item.id));
        list.append(card);
      }
    }

    async function loadFeedback() {
      stateBox.hidden = false;
      stateBox.textContent = 'Cargando feedback...';
      try {
        const res = await fetch(`./api/feedback?ts=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('No se pudo cargar el feedback');
        entries = await res.json();
        render();
      } catch (error) {
        stateBox.hidden = false;
        stateBox.textContent = 'No se pudo cargar el feedback. Revisa la conexión o el backend.';
      }
    }

    async function markReviewed(id) {
      const cardButton = [...document.querySelectorAll('.actions button')]
        .find((button) => button.closest('.item')?.textContent.includes(id));
      if (cardButton) cardButton.disabled = true;
      try {
        const res = await fetch('./api/feedback', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: 'revisado' }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) throw new Error(body.error || 'No se pudo actualizar');
        entries = entries.map((item) => item.id === id ? body.item : item);
        render();
      } catch (error) {
        alert('No se pudo marcar como revisado. Inténtalo otra vez.');
        if (cardButton) cardButton.disabled = false;
      }
    }

    searchInput.addEventListener('input', render);
    appFilter.addEventListener('change', render);
    statusFilter.addEventListener('change', render);
    loadFeedback();
  </script>
</body>
</html>
