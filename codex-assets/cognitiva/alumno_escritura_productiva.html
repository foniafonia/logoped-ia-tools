<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitiva · Escritura Productiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/alumno_escritura_productiva.css" />
  <link rel="stylesheet" href="./src/cognitiva-theme.css?v=2" />
</head>
<body>
  <main class="screen">
    <section class="header-card">
      <h2 id="title">Fase 1: Ordena la historia</h2>
      <p id="subtitle">Primero planifica el orden lógico.</p>
    </section>

    <section id="phase1" class="panel">
      <div id="slots" class="slots"></div>
      <div id="vignettes" class="vignettes"></div>
    </section>

    <section id="phase2" class="panel hidden">
      <div id="storyRows" class="story-rows"></div>
      <button id="submitPhase2" class="submit-btn" type="button">Finalizar historia</button>
    </section>

    <section class="feedback-zone">
      <div id="dot" class="dot"></div>
    </section>
  </main>

<script defer>
/* AUTOGENERADO OFFLINE: fusion de taller_escritura_productiva.js + alumno_escritura_productiva.js */
function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const STORY = {
  id_historia: "hist_001",
  titulo: "De semilla a flor",
  vinetas: [
    { id: "v1", orden_correcto: 1, emoji: "🌱", descripcion: "Sembrar la semilla" },
    { id: "v2", orden_correcto: 2, emoji: "💧", descripcion: "Regar la planta" },
    { id: "v3", orden_correcto: 3, emoji: "🌸", descripcion: "Recoger la flor" }
  ],
  nexos: ["Al principio,", "Después,", "Finalmente,"]
};

class MotorGestion {
  constructor(profileId) {
    this.profileId = profileId;
    this.metrics = {
      aciertos: 0,
      errores: 0,
      intentos: 0,
      tiempo_planificacion_ms: 0,
      tiempo_ejecucion_ms: 0,
      eventos: []
    };
  }

  registerAttempt(event) {
    this.metrics.intentos += 1;
    if (event.correct) this.metrics.aciertos += 1;
    else this.metrics.errores += 1;
    this.metrics.eventos.push(event);
  }

  setPlanningTime(ms) {
    this.metrics.tiempo_planificacion_ms = ms;
  }

  setExecutionTime(ms) {
    this.metrics.tiempo_ejecucion_ms = ms;
  }

  getSessionSummary() {
    return { ...this.metrics };
  }
}

function createTallerEscrituraProductivaController(motor) {
  const state = {
    phase: 1,
    story: null,
    shuffled: [],
    selectedOrder: [],
    selectedNexos: ["", "", ""],
    texts: ["", "", ""],
    planningStartMs: 0,
    executionStartMs: 0
  };

  function nextRound() {
    state.phase = 1;
    state.story = STORY;
    state.shuffled = shuffle(STORY.vinetas);
    state.selectedOrder = [];
    state.selectedNexos = ["", "", ""];
    state.texts = ["", "", ""];
    state.planningStartMs = Date.now();
    state.executionStartMs = 0;
    return {
      phase: state.phase,
      story: state.story,
      shuffled: state.shuffled,
      selectedOrder: state.selectedOrder,
      nexos: state.story.nexos
    };
  }

  function selectVignette(vignetteId) {
    if (state.phase !== 1) return { ignore: true };
    const already = state.selectedOrder.find((v) => v.id === vignetteId);
    if (already) return { ignore: true };

    const v = state.shuffled.find((x) => x.id === vignetteId);
    if (!v) return { ignore: true };

    state.selectedOrder.push(v);
    const complete = state.selectedOrder.length === state.story.vinetas.length;

    if (!complete) {
      return { correct: true, phase: 1, complete: false, selectedOrder: state.selectedOrder };
    }

    const logical = state.selectedOrder.every((vignette, idx) => vignette.orden_correcto === idx + 1);
    motor.registerAttempt({
      tallerId: "pri_2_3_escritura_productiva_001",
      phase: 1,
      selectedIds: state.selectedOrder.map((x) => x.id),
      correct: logical,
      ts: new Date().toISOString()
    });

    if (!logical) {
      state.selectedOrder = [];
      return { correct: false, phase: 1, action: "reset_order" };
    }

    const planningMs = Date.now() - state.planningStartMs;
    motor.setPlanningTime(planningMs);
    state.phase = 2;
    state.executionStartMs = Date.now();

    return {
      correct: true,
      phase: 2,
      planningMs,
      ordered: state.selectedOrder,
      nexos: state.story.nexos,
      texts: state.texts,
      selectedNexos: state.selectedNexos
    };
  }

  function assignNexo(slotIndex, nexo) {
    if (state.phase !== 2) return { ignore: true };
    state.selectedNexos[slotIndex] = nexo;
    return { selectedNexos: state.selectedNexos };
  }

  function updateText(slotIndex, text) {
    if (state.phase !== 2) return { ignore: true };
    state.texts[slotIndex] = text;
    return { texts: state.texts };
  }

  function submitPhase2() {
    if (state.phase !== 2) return { ignore: true };

    const nexosOk = state.selectedNexos.every((n) => n && n.length > 0);
    const textOk = state.texts.every((t) => t.trim().length > 0);
    const correct = nexosOk && textOk;

    motor.registerAttempt({
      tallerId: "pri_2_3_escritura_productiva_001",
      phase: 2,
      selectedNexos: state.selectedNexos,
      texts: state.texts,
      correct,
      ts: new Date().toISOString()
    });

    if (!correct) {
      return { correct: false, phase: 2, message: "Completa todos los nexos y frases." };
    }

    const executionMs = Date.now() - state.executionStartMs;
    motor.setExecutionTime(executionMs);

    return {
      correct: true,
      phase: 2,
      completed: true,
      executionMs,
      session: motor.getSessionSummary()
    };
  }

  return {
    nextRound,
    selectVignette,
    assignNexo,
    updateText,
    submitPhase2,
    getSessionSummary: () => motor.getSessionSummary()
  };
}


const ui={title:document.getElementById('title'),subtitle:document.getElementById('subtitle'),phase1:document.getElementById('phase1'),phase2:document.getElementById('phase2'),slots:document.getElementById('slots'),vignettes:document.getElementById('vignettes'),storyRows:document.getElementById('storyRows'),submitPhase2:document.getElementById('submitPhase2'),dot:document.getElementById('dot')};
const profileId=new URLSearchParams(window.location.search).get('alumno')||('anonimo_'+Date.now());
const motor=new MotorGestion(profileId);if(typeof motor.startSession==='function')motor.startSession();
const controller=createTallerEscrituraProductivaController(motor);let state=controller.nextRound();
const dot=(k)=>{ui.dot.className='dot';if(k)ui.dot.classList.add(k);};
function p1(){ui.slots.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('div');s.className='slot';if(i<state.selectedOrder.length){s.classList.add('fill');s.textContent=state.selectedOrder[i].emoji;}else s.textContent='Orden '+(i+1);ui.slots.appendChild(s);}ui.vignettes.innerHTML='';state.shuffled.forEach(v=>{const used=state.selectedOrder.some(s=>s.id===v.id);const b=document.createElement('button');b.className='v-btn'+(used?' used':'');b.type='button';b.textContent=v.emoji;b.disabled=used;b.addEventListener('click',()=>{const r=controller.selectVignette(v.id);if(r.ignore)return;if(r.correct&&r.phase===1){state.selectedOrder=r.selectedOrder;p1();}else if(!r.correct){dot('err');ui.phase1.classList.add('shake');setTimeout(()=>ui.phase1.classList.remove('shake'),280);state=controller.nextRound();p1();}else{dot('ok');p2(r);}});ui.vignettes.appendChild(b);});}
function p2(r){ui.phase1.classList.add('hidden');ui.phase2.classList.remove('hidden');ui.title.textContent='Fase 2: Escribe la historia';ui.subtitle.textContent=`Planificación: ${r.planningMs} ms`;ui.storyRows.innerHTML='';r.ordered.forEach((v,i)=>{const row=document.createElement('div');row.className='row';const vi=document.createElement('div');vi.className='vignette-chip';vi.textContent=v.emoji;const sel=document.createElement('select');sel.className='nexo-select';sel.innerHTML='<option value="">Nexo</option>'+r.nexos.map(n=>`<option value="${n}">${n}</option>`).join('');sel.addEventListener('change',()=>controller.assignNexo(i,sel.value));const inp=document.createElement('input');inp.className='text-input';inp.placeholder='Escribe una frase...';inp.addEventListener('input',()=>controller.updateText(i,inp.value));row.append(vi,sel,inp);ui.storyRows.appendChild(row);});}
ui.submitPhase2.addEventListener('click',()=>{const r=controller.submitPhase2();if(r.ignore)return;if(!r.correct){dot('err');ui.phase2.classList.add('shake');setTimeout(()=>ui.phase2.classList.remove('shake'),280);return;}dot('ok');ui.subtitle.textContent=`Planificación: ${r.session.tiempo_planificacion_ms} ms · Ejecución: ${r.executionMs} ms`;console.log(r.session);});
p1();window.cognitivaEscrituraProductiva={controller,motor,getSummary:()=>controller.getSessionSummary()};

const id_taller = "escritura";
function persistSession(){
  localStorage.setItem(
    `cognitiva_sesion_${profileId}_${id_taller}`,
    JSON.stringify({ ...motor.getSessionSummary(), ts: new Date().toISOString() })
  );
}
window.addEventListener("pagehide", persistSession);
window.addEventListener("beforeunload", persistSession);
setInterval(persistSession, 2000);
</script>
<button type="button" onclick="window.close()" style="margin-top:16px;padding:12px 20px;border-radius:10px;border:1px solid #9bd4b0;background:#eaf8ef;color:#145a35;font-weight:800;cursor:pointer;font-size:16px">✅ Terminar y volver al camino</button>
</body>
</html>
