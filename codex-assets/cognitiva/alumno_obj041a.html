<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitiva · 2º PRIMARIA obj.041a</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/alumno_obj041a.css" />
  <link rel="stylesheet" href="./src/cognitiva-theme.css?v=2" />
</head>
<body>
  <main class="screen">
    <section class="text-card">
      <h2 id="titleEl"></h2>
      <div id="textEl" class="text-block"></div>
    </section>

    <section class="question-card">
      <h3 id="questionEl"></h3>
      <div id="optionsEl" class="options-grid"></div>
    </section>

    <section class="feedback-zone">
      <div id="feedbackDot" class="dot"></div>
    </section>
  </main>

<script defer>
/* AUTOGENERADO OFFLINE: fusion de taller041a.js + alumno_obj041a.js */
function pickOne(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const INFER_ITEMS = [
  {
    id_item: "inf_001",
    titulo: "Llegada de Maria",
    lineas: [
      "Maria llego a casa empapada y tiritando de frio.",
      "Dejo su paraguas goteando en la entrada.",
      "Se fue directa a cambiarse de ropa."
    ],
    pregunta: "¿Que tiempo hacia en la calle?",
    opciones: ["Hacia mucho sol", "Estaba lloviendo", "Estaba nevando"],
    respuesta_correcta: "Estaba lloviendo",
    pistas: ["empapada", "paraguas goteando"]
  },
  {
    id_item: "inf_002",
    titulo: "La cocina de Pablo",
    lineas: [
      "Pablo salio corriendo de la cocina con las manos enrojecidas.",
      "La olla seguia echando vapor sobre el fuego.",
      "Su madre le puso crema fria en los dedos."
    ],
    pregunta: "¿Que le pudo pasar a Pablo?",
    opciones: ["Se quemo con algo caliente", "Se mojo con lluvia", "Se pincho con una espina"],
    respuesta_correcta: "Se quemo con algo caliente",
    pistas: ["manos enrojecidas", "olla echando vapor", "crema fria"]
  }
];

class MotorGestion {
  constructor(profileId) {
    this.profileId = profileId;
    this.metrics = { aciertos: 0, errores: 0, intentos: 0, eventos: [] };
  }

  registerAttempt(event) {
    this.metrics.intentos += 1;
    if (event.correct) this.metrics.aciertos += 1;
    else this.metrics.errores += 1;
    this.metrics.eventos.push(event);
  }

  immediateFeedback(correct) {
    return correct
      ? { type: "success", message: "Inferencia correcta" }
      : { type: "error", message: "Piensa en las pistas del texto" };
  }

  getSessionSummary() {
    const times = this.metrics.eventos.map((e) => e.responseMs);
    const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
    return { ...this.metrics, tiempo_respuesta_promedio_ms: avg };
  }
}

function generateRound(optionsCount = 3) {
  const item = pickOne(INFER_ITEMS);
  const options = shuffle(item.opciones).slice(0, optionsCount).map((text, idx) => ({
    id: `opt_${idx + 1}`,
    text,
    isCorrect: text === item.respuesta_correcta,
    eliminated: false
  }));

  return {
    item,
    question: item.pregunta,
    options,
    hintsHighlighted: false,
    eliminatedCount: 0
  };
}

function createTaller041aController(motor, config = {}) {
  const state = {
    optionsCount: config.optionsCount || 3,
    round: null,
    startMs: 0,
    attemptsInRound: 0
  };

  function nextRound() {
    state.round = generateRound(state.optionsCount);
    state.startMs = Date.now();
    state.attemptsInRound = 0;
    return state.round;
  }

  function applyFirstErrorSupport() {
    const wrongVisible = state.round.options.filter((o) => !o.isCorrect && !o.eliminated);
    if (wrongVisible.length > 0) {
      wrongVisible[0].eliminated = true;
      state.round.eliminatedCount += 1;
    }
    state.round.hintsHighlighted = true;
  }

  function clickOption(optionId) {
    const option = state.round.options.find((o) => o.id === optionId);
    if (!option || option.eliminated) return { ignore: true };

    state.attemptsInRound += 1;
    const responseMs = Date.now() - state.startMs;

    motor.registerAttempt({
      tallerId: "pri_2_obj_041a",
      itemId: state.round.item.id_item,
      question: state.round.question,
      selected: option.text,
      correctAnswer: state.round.item.respuesta_correcta,
      correct: option.isCorrect,
      responseMs,
      attemptInRound: state.attemptsInRound,
      ts: new Date().toISOString()
    });

    const feedback = motor.immediateFeedback(option.isCorrect);

    if (option.isCorrect) {
      return {
        correct: true,
        feedback,
        completed: true,
        round: state.round,
        session: motor.getSessionSummary()
      };
    }

    if (state.attemptsInRound === 1) {
      applyFirstErrorSupport();
    }

    return {
      correct: false,
      feedback,
      completed: false,
      supportApplied: state.attemptsInRound === 1,
      round: state.round,
      session: motor.getSessionSummary()
    };
  }

  return {
    nextRound,
    clickOption,
    getSessionSummary: () => motor.getSessionSummary()
  };
}


const ui={title:document.getElementById('titleEl'),text:document.getElementById('textEl'),question:document.getElementById('questionEl'),options:document.getElementById('optionsEl'),dot:document.getElementById('feedbackDot')};
const profileId=new URLSearchParams(window.location.search).get('alumno')||('anonimo_'+Date.now());
const motor=new MotorGestion(profileId);if(typeof motor.startSession==='function')motor.startSession();
const controller=createTaller041aController(motor,{optionsCount:3});let round=controller.nextRound();
function setDot(k){ui.dot.className='dot';if(k)ui.dot.classList.add(k);} function esc(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function mark(line,pistas){let out=line;pistas.forEach(p=>{out=out.replace(new RegExp(esc(p),'gi'),m=>`<span class="pista">${m}</span>`);});return out;}
function renderText(item,h){ui.title.textContent=item.titulo;ui.text.innerHTML='';item.lineas.forEach(l=>{const p=document.createElement('p');p.className='text-line';p.innerHTML=h?mark(l,item.pistas):l;ui.text.appendChild(p);});}
function render(r){renderText(r.item,r.hintsHighlighted);ui.question.textContent=r.question;ui.options.innerHTML='';r.options.forEach(opt=>{const b=document.createElement('button');b.className='opt-btn';b.type='button';b.textContent=opt.text;if(opt.eliminated){b.classList.add('eliminated');b.disabled=true;}b.addEventListener('click',()=>{const res=controller.clickOption(opt.id);if(res.ignore)return;console.log(res.feedback.message,res.session);if(res.correct){b.classList.add('correct');setDot('ok');setTimeout(()=>{round=controller.nextRound();render(round);setDot(null);},900);}else{b.classList.add('error');setDot('err');setTimeout(()=>b.classList.remove('error'),260);round=res.round;render(round);}});ui.options.appendChild(b);});}
render(round);window.cognitivaObj041a={controller,motor,getSummary:()=>controller.getSessionSummary()};

const id_taller = "obj041a";
function persistSession(){
  localStorage.setItem(
    `cognitiva_sesion_${profileId}_${id_taller}`,
    JSON.stringify({ ...motor.getSessionSummary(), ts: new Date().toISOString() })
  );
}
window.addEventListener("pagehide", persistSession);
window.addEventListener("beforeunload", persistSession);
setInterval(persistSession, 2000);
</script>
<button type="button" onclick="window.close()" style="margin-top:16px;padding:12px 20px;border-radius:10px;border:1px solid #9bd4b0;background:#eaf8ef;color:#145a35;font-weight:800;cursor:pointer;font-size:16px">✅ Terminar y volver al camino</button>
</body>
</html>
