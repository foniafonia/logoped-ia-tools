        // Phoneme selector
        phonemeSelectEl.addEventListener('change', () => {
            state.selectedPhoneme = phonemeSelectEl.value;
            if (state.mode === 'fonemas') {
                missionTargetEl.textContent = `palabras con /${state.selectedPhoneme}/`;
                initGame();
            }
        });

        // Content generators
        const generators = {
            pares: () => {
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const num = Math.floor(Math.random() * 50) + 1;
                    items.push({ value: num, correct: num % 2 === 0 });
                }
                return items;
            },
            impares: () => {
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const num = Math.floor(Math.random() * 50) + 1;
                    items.push({ value: num, correct: num % 2 !== 0 });
                }
                return items;
            },
            mayusculas: () => {
                const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const lower = 'abcdefghijklmnopqrstuvwxyz';
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const isUpper = Math.random() > 0.5;
                    const letters = isUpper ? upper : lower;
                    const letter = letters[Math.floor(Math.random() * letters.length)];
                    items.push({ value: letter, correct: isUpper, caseType: isUpper ? 'uppercase' : 'lowercase' });
                }
                return items;
            },
            minusculas: () => {
                const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const lower = 'abcdefghijklmnopqrstuvwxyz';
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const isLower = Math.random() > 0.5;
                    const letters = isLower ? lower : upper;
                    const letter = letters[Math.floor(Math.random() * letters.length)];
                    items.push({ value: letter, correct: isLower, caseType: isLower ? 'lowercase' : 'uppercase' });
                }
                return items;
            },
            sinfones: () => {
                const all = [...sinfonesLists.correct, ...sinfonesLists.incorrect];
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const item = all[Math.floor(Math.random() * all.length)];
                    items.push({ value: item, correct: sinfonesLists.correct.includes(item) });
                }
                return items;
            },
            fonemas: () => {
                const phoneme = state.selectedPhoneme;
                const words = phonemeWords[phoneme] || phonemeWords.r;
                const all = [...words.correct, ...words.incorrect];
                const items = [];
                for (let i = 0; i < 30; i++) {
                    const word = all[Math.floor(Math.random() * all.length)];
                    items.push({ value: word, correct: words.correct.includes(word) });
                }
                return items;
            }
        };

        function initGame() {
            state.gameActive = true;
            state.playerPos = { row: 0, col: 0 };
            state.gridSize.rows = 4 + Math.min(state.level, 3);
            state.gridSize.cols = 4 + Math.min(state.level, 3);
            state.goalPos = { row: state.gridSize.rows - 1, col: state.gridSize.cols - 1 };
            state.lastMoveTime = Date.now();
            state.livesLostThisLevel = 0;

            generatePlatforms();
            addBonusHearts();
            renderGrid();
            updatePlayerPosition();
            spawnEnemies();
            updateLivesDisplay();
            updateRemainingCount();
            startInactivityTimer();

            gameOverEl.classList.remove('active');
            levelCompleteEl.classList.remove('active');
            playerEl.classList.remove('falling', 'hit');
        }

        function addBonusHearts() {
            // Add 1 bonus heart platform per level (max 2)
            const numHearts = Math.min(Math.floor(state.level / 2) + 1, 2);
            let heartsAdded = 0;

            // Find incorrect platforms that are not start/goal
            const candidates = [];
            for (let row = 0; row < state.gridSize.rows; row++) {
                for (let col = 0; col < state.gridSize.cols; col++) {
                    const p = state.platforms[row][col];
                    if (!p.correct && !p.isStart && !p.isGoal && !p.mustVisit) {
                        candidates.push({ row, col });
                    }
                }
            }

            // Randomly select platforms for hearts
            while (heartsAdded < numHearts && candidates.length > 0) {
                const idx = Math.floor(Math.random() * candidates.length);
                const { row, col } = candidates.splice(idx, 1)[0];
                const p = state.platforms[row][col];

                p.isBonusHeart = true;
                p.correct = true; // Safe to step on
                p.value = '❤️';
                heartsAdded++;
            }
        }

        function generatePlatforms() {
            const items = generators[state.mode]();
            state.platforms = [];
            state.remainingCorrect = 0;
            state.totalCorrect = 0;

            let idx = 0;
            for (let row = 0; row < state.gridSize.rows; row++) {
                const rowPlatforms = [];
                for (let col = 0; col < state.gridSize.cols; col++) {
                    if (row === 0 && col === 0) {
                        rowPlatforms.push({ value: '🚶', correct: true, isStart: true, visited: false });
                    } else if (row === state.goalPos.row && col === state.goalPos.col) {
                        rowPlatforms.push({ value: '🏁', correct: true, isGoal: true, visited: false });
                    } else {
                        const item = { ...items[idx % items.length], visited: false, mustVisit: false };
                        if (item.correct) {
                            item.mustVisit = true;
                            state.totalCorrect++;
                            state.remainingCorrect++;
                        }
                        rowPlatforms.push(item);
                        idx++;
                    }
                }
                state.platforms.push(rowPlatforms);
            }
            ensureValidPath();
        }

        function ensureValidPath() {
            // Get all correct items (mustVisit) positions
            const correctItems = [];
            for (let row = 0; row < state.gridSize.rows; row++) {
                for (let col = 0; col < state.gridSize.cols; col++) {
                    const p = state.platforms[row][col];
                    if (p.mustVisit && !p.isStart && !p.isGoal) {
                        correctItems.push({ row, col });
                    }
                }
            }

            // Ensure at least 3 correct items exist
            while (correctItems.length < 3) {
                const row = Math.floor(Math.random() * (state.gridSize.rows - 1)) + 1;
                const col = Math.floor(Math.random() * state.gridSize.cols);
                const p = state.platforms[row][col];
                if (!p.correct && !p.isGoal && !p.isStart) {
                    p.correct = true;
                    p.mustVisit = true;
                    updateValueForCorrect(p);
                    state.totalCorrect++;
                    state.remainingCorrect++;
                    correctItems.push({ row, col });
                }
            }

            // Helper function to check if two cells are adjacent (8 directions)
            const isAdjacent = (r1, c1, r2, c2) => {
                return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && (r1 !== r2 || c1 !== c2);
            };

            // Helper function to check if cell is safe to step on (correct, start, or goal when unlocked)
            const isSafe = (row, col) => {
                if (row < 0 || row >= state.gridSize.rows || col < 0 || col >= state.gridSize.cols) return false;
                const p = state.platforms[row][col];
                return p.correct || p.isStart || p.isGoal;
            };

            // BFS to find all reachable safe cells from start
            const getReachableCells = () => {
                const visited = new Set();
                const queue = [{ row: 0, col: 0 }];
                visited.add('0,0');

                while (queue.length > 0) {
                    const { row, col } = queue.shift();

                    // Check all 8 directions
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = row + dr;
                            const nc = col + dc;
                            const key = `${nr},${nc}`;

                            if (!visited.has(key) && isSafe(nr, nc)) {
                                visited.add(key);
                                queue.push({ row: nr, col: nc });
                            }
                        }
                    }
                }
                return visited;
            };

            // Create a path from one cell to another by converting cells to correct
            const createPath = (fromRow, fromCol, toRow, toCol) => {
                let currentRow = fromRow;
                let currentCol = fromCol;

                while (currentRow !== toRow || currentCol !== toCol) {
                    // Move towards target
                    const dr = Math.sign(toRow - currentRow);
                    const dc = Math.sign(toCol - currentCol);

                    currentRow += dr;
                    currentCol += dc;

                    // Ensure we're in bounds
                    if (currentRow < 0 || currentRow >= state.gridSize.rows ||
                        currentCol < 0 || currentCol >= state.gridSize.cols) break;

                    const p = state.platforms[currentRow][currentCol];

                    // Skip if already correct, goal, or start
                    if (p.correct || p.isGoal || p.isStart) continue;

                    // Convert this cell to correct
                    p.correct = true;
                    p.mustVisit = true;
                    updateValueForCorrect(p);
                    state.totalCorrect++;
                    state.remainingCorrect++;
                }
            };

            // Find the nearest reachable cell to a target
            const findNearestReachable = (targetRow, targetCol, reachable) => {
                let nearest = null;
                let minDist = Infinity;

                for (const key of reachable) {
                    const [r, c] = key.split(',').map(Number);
                    const dist = Math.max(Math.abs(r - targetRow), Math.abs(c - targetCol));
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = { row: r, col: c };
                    }
                }
                return nearest;
            };

            // Keep fixing until all correct items are reachable
            let maxIterations = 20;
            while (maxIterations-- > 0) {
                const reachable = getReachableCells();
                let allReachable = true;

                // Check each correct item
                for (const item of correctItems) {
                    const key = `${item.row},${item.col}`;
                    if (!reachable.has(key)) {
                        allReachable = false;
                        // Find nearest reachable cell and create path to this item
                        const nearest = findNearestReachable(item.row, item.col, reachable);
                        if (nearest) {
                            createPath(nearest.row, nearest.col, item.row, item.col);
                        }
                        break; // Recalculate reachable after creating path
                    }
                }

                // Also ensure goal is reachable
                const goalKey = `${state.goalPos.row},${state.goalPos.col}`;
                if (!reachable.has(goalKey)) {
                    allReachable = false;
                    const nearest = findNearestReachable(state.goalPos.row, state.goalPos.col, reachable);
                    if (nearest) {
                        createPath(nearest.row, nearest.col, state.goalPos.row, state.goalPos.col);
                    }
                }

                if (allReachable) break;
            }
        }

        function updateValueForCorrect(platform) {
            switch (state.mode) {
                case 'pares':
                    platform.value = (Math.floor(Math.random() * 25) + 1) * 2;
                    break;
                case 'impares':
                    platform.value = (Math.floor(Math.random() * 25) * 2) + 1;
                    break;
                case 'mayusculas':
                    platform.value = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 26)];
                    platform.caseType = 'uppercase';
                    break;
                case 'minusculas':
                    platform.value = 'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random() * 26)];
                    platform.caseType = 'lowercase';
                    break;
                case 'sinfones':
                    platform.value = sinfonesLists.correct[Math.floor(Math.random() * sinfonesLists.correct.length)];
                    break;
                case 'fonemas':
                    const words = phonemeWords[state.selectedPhoneme] || phonemeWords.r;
                    platform.value = words.correct[Math.floor(Math.random() * words.correct.length)];
                    break;
            }
        }

        function updateRemainingCount() {
            remainingCountEl.textContent = state.remainingCorrect;
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            gridEl.style.gridTemplateColumns = `repeat(${state.gridSize.cols}, 1fr)`;
            gridEl.style.gridTemplateRows = `repeat(${state.gridSize.rows}, 1fr)`;

            for (let row = 0; row < state.gridSize.rows; row++) {
                for (let col = 0; col < state.gridSize.cols; col++) {
                    const platform = state.platforms[row][col];
                    const div = document.createElement('div');
                    div.className = 'platform';
                    div.dataset.row = row;
                    div.dataset.col = col;

                    // Add case type class for uppercase/lowercase
                    if (platform.caseType) {
                        div.classList.add(platform.caseType);
                    }

                    if (platform.isGoal) {
                        div.classList.add('goal');
                        if (state.remainingCorrect > 0) {
                            div.classList.add('goal-locked');
                        }
                    }
                    if (platform.isBonusHeart && !platform.visited) {
                        div.classList.add('bonus-heart');
                    }
                    if (platform.visited) div.classList.add('visited');
                    if (platform.mustVisit && !platform.visited) div.classList.add('must-visit');

                    div.innerHTML = `
                        <div class="platform-stone"></div>
                        <span class="platform-content">${platform.value}</span>
                    `;

                    div.addEventListener('click', () => handlePlatformClick(row, col));
                    div.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        handlePlatformClick(row, col);
                    }, { passive: false });

                    gridEl.appendChild(div);
                }
            }
        }

        function startInactivityTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);

            state.timerInterval = setInterval(() => {
                if (!state.gameActive) return;

                const elapsed = Date.now() - state.lastMoveTime;
                const remaining = Math.max(0, state.maxInactivityTime - elapsed);
                const percent = (remaining / state.maxInactivityTime) * 100;

                timerFillEl.style.width = `${percent}%`;

                if (percent < 30) {
                    timerFillEl.classList.add('warning');
                    document.querySelectorAll('.enemy').forEach(e => e.classList.add('angry'));
                } else {
                    timerFillEl.classList.remove('warning');
                    document.querySelectorAll('.enemy').forEach(e => e.classList.remove('angry'));
                }

                if (remaining <= 0) {
                    shootAtPlayer();
                    state.lastMoveTime = Date.now();
                }
            }, 100);
        }

        function resetInactivityTimer() {
            state.lastMoveTime = Date.now();
            timerFillEl.style.width = '100%';
            timerFillEl.classList.remove('warning');
            document.querySelectorAll('.enemy').forEach(e => e.classList.remove('angry'));
        }

        function handlePlatformClick(row, col) {
            if (!state.gameActive) return;

            const rowDiff = Math.abs(row - state.playerPos.row);
            const colDiff = Math.abs(col - state.playerPos.col);

            if (rowDiff <= 1 && colDiff <= 1 && (rowDiff > 0 || colDiff > 0)) {
                movePlayer(row, col);
            }
        }

        function movePlayer(newRow, newCol) {
            if (!state.gameActive) return;
            if (newRow < 0 || newRow >= state.gridSize.rows || newCol < 0 || newCol >= state.gridSize.cols) return;

            resetInactivityTimer();

            const platform = state.platforms[newRow][newCol];

            // Check if trying to reach goal without collecting all correct items
            if (platform.isGoal && state.remainingCorrect > 0) {
                // Can't enter goal yet - visual feedback
                const goalEl = document.querySelector(`.platform[data-row="${newRow}"][data-col="${newCol}"]`);
                if (goalEl) {
                    goalEl.style.animation = 'none';
                    goalEl.offsetHeight;
                    goalEl.style.animation = 'shake 0.3s';
                }
                return;
            }

            // Mark current as visited
            const currentPlatform = state.platforms[state.playerPos.row][state.playerPos.col];
            if (!currentPlatform.isStart) {
                currentPlatform.visited = true;
                const currentEl = document.querySelector(`.platform[data-row="${state.playerPos.row}"][data-col="${state.playerPos.col}"]`);
                if (currentEl) {
                    currentEl.classList.add('visited');
                    currentEl.classList.remove('must-visit');
                }
            }

            state.playerPos.row = newRow;
            state.playerPos.col = newCol;
            updatePlayerPosition();

            if (platform.correct || platform.isGoal || platform.isStart) {
                const platformEl = document.querySelector(`.platform[data-row="${newRow}"][data-col="${newCol}"]`);

                // Check if bonus heart
                if (platform.isBonusHeart && !platform.visited) {
                    gainLife('¡Corazón bonus!');
                    platformEl.classList.remove('bonus-heart');
                }

                // Track collected correct items
                if (platform.mustVisit && !platform.visited) {
                    state.remainingCorrect--;
                    updateRemainingCount();

                    // Update goal appearance
                    const goalEl = document.querySelector('.platform.goal');
                    if (goalEl && state.remainingCorrect === 0) {
                        goalEl.classList.remove('goal-locked');
                    }
                }

                platform.visited = true;
                if (platformEl && !platform.isGoal) {
                    platformEl.classList.add('correct');
                    platformEl.classList.remove('must-visit');
                }

                playSoundCorrect();
                state.score += 10;
                scoreEl.textContent = state.score;

                // Check for points milestone (every 200 points = extra life)
                checkPointsMilestone();

                if (platform.isGoal) {
                    state.gameActive = false;
                    if (state.timerInterval) clearInterval(state.timerInterval);
                    if (state.enemyMoveInterval) clearInterval(state.enemyMoveInterval);
                    state.score += 100;
                    scoreEl.textContent = state.score;

                    // Bonus life if completed without losing lives
                    let bonusMessage = '';
                    if (state.livesLostThisLevel === 0) {
                        gainLife('¡Nivel perfecto!');
                        bonusMessage = ' 🌟 ¡+1 vida por nivel perfecto!';
                    }

                    completeMessageEl.textContent = `¡Recogiste todo! +100 puntos • Nivel ${state.level}${bonusMessage}`;
                    playSoundLevelComplete();
                    setTimeout(() => levelCompleteEl.classList.add('active'), 500);
                }
            } else {
                // Wrong move - lose a life but continue if lives remain
                playSoundWrong();
                const platformEl = document.querySelector(`.platform[data-row="${newRow}"][data-col="${newCol}"]`);
                if (platformEl) {
                    platformEl.classList.add('wrong');
                    setTimeout(() => platformEl.classList.remove('wrong'), 800);
                }

                state.lives--;
                state.livesLostThisLevel++;
                updateLivesDisplay();

                // Animate life loss
                const hearts = livesEl.querySelectorAll('.heart');
                if (hearts[state.lives]) {
                    hearts[state.lives].classList.add('hit');
                    setTimeout(() => hearts[state.lives].classList.remove('hit'), 500);
                }

                // Show error feedback
                playerEl.classList.add('hit');
                showErrorFeedback(`"${platform.value}" no es ${missionTexts[state.mode]}`);

                if (state.lives <= 0) {
                    // Game over - no more lives
                    state.gameActive = false;
                    if (state.timerInterval) clearInterval(state.timerInterval);
                    if (state.enemyMoveInterval) clearInterval(state.enemyMoveInterval);
                    playerEl.classList.add('falling');

                    playSoundGameOver();
                    setTimeout(() => {
                        gameoverMessageEl.textContent = `¡Sin vidas! Puntuación final: ${state.score}`;
                        gameOverEl.querySelector('.overlay-title').textContent = '💀 Game Over';
                        gameOverEl.classList.add('active');
                    }, 800);
                } else {
                    // Return to previous position
                    setTimeout(() => {
                        state.playerPos.row = state.playerPos.row === newRow ?
                            (newRow > 0 ? newRow - 1 : 0) : state.playerPos.row;
                        state.playerPos.col = state.playerPos.col === newCol ?
                            (newCol > 0 ? newCol - 1 : 0) : state.playerPos.col;
                        updatePlayerPosition();
                        playerEl.classList.remove('hit');
                    }, 500);
                }
            }
        }

        function showErrorFeedback(message) {
            const feedback = document.createElement('div');
            feedback.className = 'error-feedback';
            feedback.textContent = message;
            gameArea.appendChild(feedback);

            setTimeout(() => feedback.remove(), 2000);
        }

        function gainLife(reason) {
            if (state.lives < state.maxLives) {
                state.lives++;
                updateLivesDisplay();
                playSoundGainLife();

                // Show life gained animation
                const lifeGained = document.createElement('div');
                lifeGained.className = 'life-gained';
                lifeGained.textContent = '❤️ +1';
                gameArea.appendChild(lifeGained);
                setTimeout(() => lifeGained.remove(), 1500);

                // Animate the new heart
                const hearts = livesEl.querySelectorAll('.heart');
                if (hearts[state.lives - 1]) {
                    hearts[state.lives - 1].style.animation = 'none';
                    hearts[state.lives - 1].offsetHeight;
                    hearts[state.lives - 1].style.animation = 'heartGain 0.5s ease-out';
                }

                // Show milestone badge
                const badge = document.createElement('div');
                badge.className = 'milestone-badge';
                badge.textContent = reason;
                gameArea.appendChild(badge);
                setTimeout(() => badge.remove(), 2500);
            }
        }

        function checkPointsMilestone() {
            // Every 200 points = 1 extra life
            const milestone = Math.floor(state.score / 200);
            if (milestone > state.lastMilestone) {
                state.lastMilestone = milestone;
                gainLife(`¡${milestone * 200} puntos!`);
            }
        }

        function updatePlayerPosition() {
            // Remove player-here from all platforms
            document.querySelectorAll('.platform.player-here').forEach(p => p.classList.remove('player-here'));

            const platformEl = document.querySelector(`.platform[data-row="${state.playerPos.row}"][data-col="${state.playerPos.col}"]`);
            if (platformEl) {
                // Add player-here to current platform
                platformEl.classList.add('player-here');

                const rect = platformEl.getBoundingClientRect();
                const gameAreaRect = gameArea.getBoundingClientRect();

                const playerWidth = 45;
                const playerHeight = 45;
                const centerX = rect.left - gameAreaRect.left + (rect.width / 2) - (playerWidth / 2);
                const centerY = rect.top - gameAreaRect.top + (rect.height / 2) - playerHeight - 5;

                playerEl.style.left = `${centerX}px`;
                playerEl.style.top = `${centerY}px`;
                playerEl.classList.remove('falling');
            }
        }

        function updateLivesDisplay() {
            const hearts = livesEl.querySelectorAll('.heart');
            hearts.forEach((heart, index) => {
                // Show only up to maxLives hearts
                if (index < state.maxLives) {
                    heart.style.display = '';
                    heart.classList.toggle('lost', index >= state.lives);
                } else {
                    heart.style.display = 'none';
                }
            });
        }

        const enemyTaunts = ['¡Te veo!', '¡Ven aquí!', '¡No escaparás!', '¡Jajaja!', '¡Cuidado!', '¡Boom!'];

        function spawnEnemies() {
            document.querySelectorAll('.enemy').forEach(e => e.remove());
            document.querySelectorAll('.projectile').forEach(p => p.remove());
            state.enemies = [];

            // Stop any existing enemy movement
            if (state.enemyMoveInterval) {
                clearInterval(state.enemyMoveInterval);
            }

            const enemyCount = Math.min(state.level + 1, 4);
            const areaRect = gameArea.getBoundingClientRect();

            for (let i = 0; i < enemyCount; i++) {
                const enemy = document.createElement('div');
                enemy.className = 'enemy';
                enemy.innerHTML = `
                    <div class="enemy-glow"></div>
                    <div class="enemy-body">${villainEmojis[i % villainEmojis.length]}</div>
                    <div class="enemy-speech">${enemyTaunts[i % enemyTaunts.length]}</div>
                `;

                const side = i % 2 === 0 ? 'left' : 'right';
                const startX = side === 'left' ? 10 : areaRect.width - 70;
                const startY = 50 + (i * 80);

                enemy.style.left = `${startX}px`;
                enemy.style.top = `${startY}px`;
                enemy.dataset.side = side;
                enemy.dataset.baseX = startX;
                enemy.dataset.baseY = startY;
                enemy.dataset.targetX = startX;
                enemy.dataset.targetY = startY;

                gameArea.appendChild(enemy);
                state.enemies.push(enemy);

                // Random taunt timing
                setInterval(() => {
                    if (state.gameActive && Math.random() < 0.3) {
                        enemy.classList.add('speaking');
                        enemy.querySelector('.enemy-speech').textContent = enemyTaunts[Math.floor(Math.random() * enemyTaunts.length)];
                        setTimeout(() => enemy.classList.remove('speaking'), 2000);
                    }
                }, 4000 + Math.random() * 3000);
            }

            // Start enemy movement AI
            startEnemyMovement();
        }

        function startEnemyMovement() {
            if (state.enemyMoveInterval) {
                clearInterval(state.enemyMoveInterval);
            }

            state.enemyMoveInterval = setInterval(() => {
                if (!state.gameActive) return;

                const playerRect = playerEl.getBoundingClientRect();
                const areaRect = gameArea.getBoundingClientRect();
                const playerCenterX = playerRect.left - areaRect.left + playerRect.width / 2;
                const playerCenterY = playerRect.top - areaRect.top + playerRect.height / 2;

                const elapsed = Date.now() - state.lastMoveTime;
                const urgency = Math.min(1, elapsed / state.maxInactivityTime);

                state.enemies.forEach((enemy, index) => {
                    const currentX = parseFloat(enemy.style.left) || 0;
                    const currentY = parseFloat(enemy.style.top) || 0;
                    const baseX = parseFloat(enemy.dataset.baseX);
                    const baseY = parseFloat(enemy.dataset.baseY);
                    const side = enemy.dataset.side;

                    // Calculate target position (chase player more when timer is low)
                    let targetX, targetY;

                    if (urgency > 0.5) {
                        // Chase more aggressively
                        enemy.classList.add('chasing');
                        const chaseIntensity = (urgency - 0.5) * 2; // 0 to 1

                        // Move towards player but stay on sides
                        if (side === 'left') {
                            targetX = Math.min(areaRect.width * 0.35, baseX + (playerCenterX - baseX) * chaseIntensity * 0.5);
                        } else {
                            targetX = Math.max(areaRect.width * 0.65, baseX + (playerCenterX - baseX) * chaseIntensity * 0.5);
                        }
                        targetY = baseY + (playerCenterY - baseY) * chaseIntensity * 0.7;

                        // Clamp Y position
                        targetY = Math.max(30, Math.min(areaRect.height - 150, targetY));
                    } else {
                        // Patrol mode - wander around base position
                        enemy.classList.remove('chasing');
                        const patrolRadius = 40;
                        const time = Date.now() / 1000 + index * 2;
                        targetX = baseX + Math.sin(time * 0.8) * patrolRadius;
                        targetY = baseY + Math.cos(time * 0.6) * patrolRadius * 0.5;
                    }

                    // Smoothly move towards target
                    const moveSpeed = 0.08 + urgency * 0.1;
                    const newX = currentX + (targetX - currentX) * moveSpeed;
                    const newY = currentY + (targetY - currentY) * moveSpeed;

                    enemy.style.left = `${newX}px`;
                    enemy.style.top = `${newY}px`;

                    // Face the player
                    const facingRight = playerCenterX > newX + 30;
                    enemy.querySelector('.enemy-body').style.transform =
                        `translateY(${Math.sin(Date.now() / 300) * 8}px) scaleX(${facingRight ? 1 : -1})`;
                });
            }, 50);
        }

        function shootAtPlayer() {
            if (!state.gameActive || state.enemies.length === 0) return;

            const enemy = state.enemies[Math.floor(Math.random() * state.enemies.length)];

            // Enemy reaction when shooting
            enemy.classList.add('speaking');
            enemy.querySelector('.enemy-speech').textContent = '¡BOOM!';
            setTimeout(() => enemy.classList.remove('speaking'), 1500);

            playSoundShoot();

            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.textContent = '🔥';

            const enemyRect = enemy.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            const playerRect = playerEl.getBoundingClientRect();

            const startX = enemyRect.left - areaRect.left + 25;
            const startY = enemyRect.top - areaRect.top + 25;
            const targetX = playerRect.left - areaRect.left + 22;
            const targetY = playerRect.top - areaRect.top + 22;

            projectile.style.left = `${startX}px`;
            projectile.style.top = `${startY}px`;

            gameArea.appendChild(projectile);

            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const speed = 10;
            const vx = (dx / distance) * speed;
            const vy = (dy / distance) * speed;

            let posX = startX, posY = startY;
            let trailCounter = 0;

            const moveProjectile = () => {
                if (!state.gameActive) {
                    projectile.remove();
                    return;
                }

                posX += vx;
                posY += vy;
                projectile.style.left = `${posX}px`;
                projectile.style.top = `${posY}px`;

                // Create trail effect every few frames
                trailCounter++;
                if (trailCounter % 3 === 0) {
                    const trail = document.createElement('div');
                    trail.className = 'projectile-trail';
                    trail.style.left = `${posX + 7}px`;
                    trail.style.top = `${posY + 7}px`;
                    gameArea.appendChild(trail);
                    setTimeout(() => trail.remove(), 300);
                }

                const projRect = projectile.getBoundingClientRect();
                const currentPlayerRect = playerEl.getBoundingClientRect();

                if (
                    projRect.left < currentPlayerRect.right &&
                    projRect.right > currentPlayerRect.left &&
                    projRect.top < currentPlayerRect.bottom &&
                    projRect.bottom > currentPlayerRect.top
                ) {
                    projectile.remove();
                    handlePlayerHit();
                    return;
                }

                if (posX < -20 || posX > areaRect.width + 20 || posY < -20 || posY > areaRect.height + 20) {
                    projectile.remove();
                    return;
                }

                requestAnimationFrame(moveProjectile);
            };

            requestAnimationFrame(moveProjectile);
        }

        function handlePlayerHit() {
            if (!state.gameActive) return;

            playSoundHit();
            state.lives--;
            updateLivesDisplay();

            const hearts = livesEl.querySelectorAll('.heart');
            if (hearts[state.lives]) {
                hearts[state.lives].classList.add('hit');
                setTimeout(() => hearts[state.lives].classList.remove('hit'), 500);
            }

            playerEl.classList.add('hit');
            setTimeout(() => playerEl.classList.remove('hit'), 500);

            if (state.lives <= 0) {
                state.gameActive = false;
                if (state.timerInterval) clearInterval(state.timerInterval);
                if (state.enemyMoveInterval) clearInterval(state.enemyMoveInterval);
                playerEl.classList.add('falling');

                playSoundGameOver();
                setTimeout(() => {
                    gameoverMessageEl.textContent = `¡Los malotes te atraparon! Puntuación: ${state.score}`;
                    gameOverEl.querySelector('.overlay-title').textContent = '💥 ¡Te dieron!';
                    gameOverEl.classList.add('active');
                }, 500);
            }
        }

        // Controls
        function handleMove(direction) {
            if (!state.gameActive) return;

            let newRow = state.playerPos.row;
            let newCol = state.playerPos.col;

            switch (direction) {
                case 'up': newRow--; break;
                case 'down': newRow++; break;
                case 'left': newCol--; break;
                case 'right': newCol++; break;
                case 'upleft': newRow--; newCol--; break;
                case 'upright': newRow--; newCol++; break;
                case 'downleft': newRow++; newCol--; break;
                case 'downright': newRow++; newCol++; break;
            }

            movePlayer(newRow, newCol);
        }

        document.querySelectorAll('.control-btn').forEach(btn => {
            if (btn.dataset.dir) {
                btn.addEventListener('click', () => handleMove(btn.dataset.dir));
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleMove(btn.dataset.dir);
                }, { passive: false });
            }
        });

        // Keyboard mapping for all directions
        const keyMap = {
            // Cardinal directions - WASD
            'w': 'up', 'W': 'up',
            's': 'down', 'S': 'down',
            'a': 'left', 'A': 'left',
            'd': 'right', 'D': 'right',
            // Cardinal directions - Arrow keys
            'ArrowUp': 'up',
            'ArrowDown': 'down',
            'ArrowLeft': 'left',
            'ArrowRight': 'right',
            // Cardinal directions - Numpad
            '8': 'up',
            '2': 'down',
            '4': 'left',
            '6': 'right',
            // Diagonal directions - QEZC
            'q': 'upleft', 'Q': 'upleft',
            'e': 'upright', 'E': 'upright',
            'z': 'downleft', 'Z': 'downleft',
            'c': 'downright', 'C': 'downright',
            // Diagonal directions - Numpad
            '7': 'upleft',
            '9': 'upright',
            '1': 'downleft',
            '3': 'downright',
            // Diagonal directions - Home/End/PgUp/PgDown

        document.addEventListener('keydown', (e) => {

        // ========== SWIPE GESTURE SYSTEM ==========
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        const minSwipeDistance = 30; // Minimum distance for a swipe
        const maxSwipeTime = 500; // Maximum time for a swipe (ms)

        gameArea.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        }, { passive: true });

        gameArea.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const touchEndTime = Date.now();

                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                const deltaTime = touchEndTime - touchStartTime;

                // Check if it's a valid swipe
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                if (distance >= minSwipeDistance && deltaTime <= maxSwipeTime) {
                    // Calculate angle
                    const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

                    // Determine direction based on angle
                    // Angles: Right=0, Down=90, Left=180/-180, Up=-90
                    let direction;

                    if (angle >= -22.5 && angle < 22.5) {
                        direction = 'right';
                    } else if (angle >= 22.5 && angle < 67.5) {
                        direction = 'downright';
                    } else if (angle >= 67.5 && angle < 112.5) {
                        direction = 'down';
                    } else if (angle >= 112.5 && angle < 157.5) {
                        direction = 'downleft';
                    } else if (angle >= 157.5 || angle < -157.5) {
                        direction = 'left';
                    } else if (angle >= -157.5 && angle < -112.5) {
                        direction = 'upleft';
                    } else if (angle >= -112.5 && angle < -67.5) {
                        direction = 'up';
                    } else if (angle >= -67.5 && angle < -22.5) {
                        direction = 'upright';
                    }

                    if (direction) {
                        handleMove(direction);
                        // Hide swipe hint after first successful swipe
                        const hint = document.getElementById('swipe-hint');
                        if (hint) {
                            hint.style.opacity = '0';
                            setTimeout(() => hint.remove(), 300);
                        }
                    }
                }
            }
        }, { passive: true });

        // Visual swipe indicator
        let swipeIndicator = null;

        gameArea.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && state.gameActive) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                if (distance >= minSwipeDistance / 2) {
                    if (!swipeIndicator) {
                        swipeIndicator = document.createElement('div');
                        swipeIndicator.className = 'swipe-indicator';
                        gameArea.appendChild(swipeIndicator);
                    }

                    const areaRect = gameArea.getBoundingClientRect();
                    const startX = touchStartX - areaRect.left;
                    const startY = touchStartY - areaRect.top;
                    const angle = Math.atan2(deltaY, deltaX);

                    swipeIndicator.style.left = `${startX}px`;
                    swipeIndicator.style.top = `${startY}px`;
                    swipeIndicator.style.width = `${Math.min(distance, 60)}px`;
                    swipeIndicator.style.transform = `rotate(${angle}rad)`;
                    swipeIndicator.style.opacity = Math.min(distance / minSwipeDistance, 1);
                }
            }
        }, { passive: true });

        gameArea.addEventListener('touchend', () => {
            if (swipeIndicator) {
                swipeIndicator.remove();
                swipeIndicator = null;
            }
        }, { passive: true });

        gameArea.addEventListener('touchcancel', () => {
            if (swipeIndicator) {
                swipeIndicator.remove();
                swipeIndicator = null;
            }
        }, { passive: true });

        // Mode buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.mode = btn.dataset.mode;

                // Show/hide phoneme selector
                phonemeSelectorEl.classList.toggle('visible', state.mode === 'fonemas');

                if (state.mode === 'fonemas') {
                    missionTargetEl.textContent = `palabras con /${state.selectedPhoneme}/`;
                } else {
                    missionTargetEl.textContent = missionTexts[state.mode];
                }

                state.level = 1;
                state.score = 0;
                state.lives = 3;
                state.lastMilestone = 0;
                levelEl.textContent = state.level;
                scoreEl.textContent = state.score;
                initGame();
            });
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            if (state.lives <= 0) {
                state.lives = 3;
                state.score = 0;
                state.level = 1;
                state.lastMilestone = 0;
                scoreEl.textContent = state.score;
                levelEl.textContent = state.level;
            }
            initGame();
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            state.level++;
            levelEl.textContent = state.level;
            initGame();
        });

        window.addEventListener('resize', () => {
            if (state.gameActive) updatePlayerPosition();
        });

        // CSS for shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // ========== AUDIO SYSTEM ==========
        let audioContext = null;
        let soundEnabled = true;
        let musicPlaying = false;
        let musicOscillators = [];
        let musicGain = null;

        const soundToggleBtn = document.getElementById('sound-toggle');

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Toggle sound on/off
        soundToggleBtn.addEventListener('click', () => {
            initAudio();
            soundEnabled = !soundEnabled;
            soundToggleBtn.textContent = soundEnabled ? '🔊 Sonido' : '🔇 Mute';

            if (soundEnabled) {
                if (!musicPlaying) startBackgroundMusic();
            } else {
                stopBackgroundMusic();
            }
        });

        // Play a tone with given frequency, duration and type
        function playTone(frequency, duration, type = 'sine', volume = 0.3, delay = 0) {
            if (!soundEnabled || !audioContext) return;

            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = type;

                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }

        // Sound effect: Correct move (pleasant ascending chime)
        function playSoundCorrect() {
            if (!soundEnabled) return;
            initAudio();
            playTone(523, 0.15, 'sine', 0.25); // C5
            playTone(659, 0.15, 'sine', 0.25, 80); // E5
            playTone(784, 0.2, 'sine', 0.2, 160); // G5
        }

        // Sound effect: Wrong move (descending buzz)
        function playSoundWrong() {
            if (!soundEnabled) return;
            initAudio();
            playTone(300, 0.15, 'sawtooth', 0.2);
            playTone(200, 0.2, 'sawtooth', 0.25, 100);
            playTone(150, 0.3, 'sawtooth', 0.15, 200);
        }

        // Sound effect: Projectile hit (harsh impact)
        function playSoundHit() {
            if (!soundEnabled) return;
            initAudio();
            playTone(150, 0.1, 'square', 0.3);
            playTone(80, 0.2, 'sawtooth', 0.25, 50);
            playTone(60, 0.15, 'square', 0.2, 120);
        }

        // Sound effect: Projectile fired (whoosh)
        function playSoundShoot() {
            if (!soundEnabled) return;

            playTone(800, 0.1, 'sine', 0.15);
            playTone(400, 0.15, 'sine', 0.1, 50);
        }

        // Sound effect: Gain life (magical sparkle)
        function playSoundGainLife() {
            if (!soundEnabled) return;
            initAudio();
            playTone(523, 0.1, 'sine', 0.2);
            playTone(659, 0.1, 'sine', 0.2, 60);
            playTone(784, 0.1, 'sine', 0.2, 120);
            playTone(1047, 0.2, 'sine', 0.25, 180);

        }

        // Sound effect: Level complete (fanfare)
        function playSoundLevelComplete() {
            if (!soundEnabled) return;
            initAudio();
            playTone(523, 0.15, 'sine', 0.25);
            playTone(659, 0.15, 'sine', 0.25, 100);
            playTone(784, 0.15, 'sine', 0.25, 200);
            playTone(1047, 0.3, 'sine', 0.3, 300);

            playTone(1047, 0.4, 'sine', 0.25, 550);
        }

        // Sound effect: Game over (sad descending)
        function playSoundGameOver() {
            if (!soundEnabled) return;
            initAudio();
            playTone(392, 0.3, 'sine', 0.25);
            playTone(349, 0.3, 'sine', 0.25, 300);
            playTone(330, 0.3, 'sine', 0.25, 600);
            playTone(262, 0.5, 'sine', 0.2, 900);
        }

        // Background music - soft ambient melody
        function startBackgroundMusic() {
            if (!soundEnabled || !audioContext || musicPlaying) return;

            musicPlaying = true;
            musicGain = audioContext.createGain();
            musicGain.connect(audioContext.destination);
            musicGain.gain.value = 0.08; // Very soft

            // Chord progression notes (peaceful ambient)
            const chords = [
                [261.63, 329.63, 392.00], // C major
                [293.66, 369.99, 440.00], // D minor (as major for brightness)
                [329.63, 415.30, 493.88], // E minor
                [349.23, 440.00, 523.25], // F major
            ];

            let chordIndex = 0;

            function playChord() {
                if (!musicPlaying || !soundEnabled) return;

                // Clear old oscillators
                musicOscillators.forEach(osc => {
                    try { osc.stop(); } catch(e) {}
                });
                musicOscillators = [];

                const chord = chords[chordIndex % chords.length];
                chordIndex++;

                chord.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const oscGain = audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    oscGain.gain.setValueAtTime(0, audioContext.currentTime);
                    oscGain.gain.linearRampToValueAtTime(0.06, audioContext.currentTime + 0.5);
                    oscGain.gain.linearRampToValueAtTime(0.04, audioContext.currentTime + 2.5);
                    oscGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 3.5);

                    osc.connect(oscGain);
                    oscGain.connect(musicGain);

                    osc.start(audioContext.currentTime + i * 0.1);
                    osc.stop(audioContext.currentTime + 4);

                    musicOscillators.push(osc);
                });

                // Add a gentle arpeggio
                const arpNotes = [chord[0] * 2, chord[1] * 2, chord[2] * 2, chord[1] * 2];
                arpNotes.forEach((freq, i) => {
                    setTimeout(() => {
                        if (!musicPlaying || !soundEnabled) return;
                        const osc = audioContext.createOscillator();
                        const oscGain = audioContext.createGain();

                        osc.type = 'triangle';
                        osc.frequency.value = freq;

                        oscGain.gain.setValueAtTime(0.03, audioContext.currentTime);
                        oscGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.8);

                        osc.connect(oscGain);
                        oscGain.connect(musicGain);

                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.8);
                    }, 500 + i * 400);
                });

                // Schedule next chord
                if (musicPlaying) {
                    setTimeout(playChord, 4000);
                }
            }

            playChord();
        }

        function stopBackgroundMusic() {
            musicPlaying = false;
            musicOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            musicOscillators = [];
        }

        // Initialize audio on first user interaction
        document.addEventListener('click', () => {
            initAudio();
            if (soundEnabled && !musicPlaying) {
                startBackgroundMusic();
            }
        }, { once: true });

        document.addEventListener('touchstart', () => {
            initAudio();
            if (soundEnabled && !musicPlaying) {
                startBackgroundMusic();
            }
        }, { once: true });

        // Start
        initGame();
    </script>
</body>
</html>
