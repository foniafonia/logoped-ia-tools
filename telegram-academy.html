<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Telegram - Skool Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0088cc;
            --primary-dark: #006399;
            --secondary: #31a24c;
            --bg-dark: #0e1419;
            --bg-light: #192734;
            --text-primary: #ffffff;
            --text-secondary: #b0bec5;
            --border: #38444d;
            --success: #31a24c;
            --warning: #ff9900;
            --danger: #e74c3c;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2332 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(14, 20, 25, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo::before {
            content: '📚';
            font-size: 1.8rem;
        }

        /* Search & Filters */
        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 136, 204, 0.1);
            background: rgba(25, 39, 52, 0.8);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .btn-tag {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 12px;
            background: rgba(0, 136, 204, 0.15);
            color: var(--primary);
            border: 1px solid rgba(0, 136, 204, 0.3);
        }

        .btn-tag.active {
            background: var(--primary);
            color: white;
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Filter Section */
        .filter-section {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .filter-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .category-badge {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text-primary);
        }

        .category-badge:hover {
            background: var(--bg-dark);
            border-color: var(--primary);
            color: var(--primary);
        }

        .category-badge.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Results Stats */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 136, 204, 0.05);
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .results-count {
            font-size: 0.95rem;
        }

        .results-count strong {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .view-options {
            display: flex;
            gap: 0.5rem;
        }

        .view-toggle {
            padding: 0.5rem 0.75rem;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .view-toggle.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .content-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .content-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.15);
            transform: translateY(-4px);
        }

        .card-media {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.1), rgba(49, 162, 76, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card-media.has-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-media.has-video::after,
        .card-media.has-audio::after {
            content: '▶';
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0, 136, 204, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-category {
            display: inline-block;
            width: fit-content;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 136, 204, 0.15);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .card-action-btn {
            padding: 0.4rem 0.6rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .card-action-btn:hover {
            background: var(--bg-dark);
            color: var(--primary);
        }

        /* List View */
        .content-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .list-item {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 1.5rem;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .list-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.1);
        }

        .list-media {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.1), rgba(49, 162, 76, 0.1));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .list-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .list-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .list-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .list-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .list-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 0;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        .modal-header {
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .modal-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .modal-body {
            color: var(--text-primary);
            line-height: 1.8;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                max-width: 100%;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .list-item {
                grid-template-columns: 80px 1fr;
                gap: 1rem;
            }

            .list-item .list-actions {
                grid-column: 2;
            }

            .list-media {
                width: 80px;
                height: 80px;
            }

            .filter-group {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Academia Telegram</div>
            <div class="search-container">
                <div class="search-box">
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="Busca contenido, tutoriales, recursos..."
                    >
                    <button class="btn btn-primary" id="searchBtn">Buscar</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-title">🏷️ Filtrar por categoría</div>
            <div class="filter-group" id="categoryFilters"></div>

            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                <div class="filter-title">📁 Tipo de contenido</div>
                <div class="filter-group" id="typeFilters"></div>
            </div>

            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button class="btn btn-secondary" id="clearFilters">✕ Limpiar filtros</button>
                <button class="btn btn-secondary" id="toggleView">📊 Cambiar vista</button>
            </div>
        </div>

        <!-- Results Info -->
        <div class="results-info">
            <div class="results-count">
                Mostrando <strong id="resultCount">0</strong> de <strong id="totalCount">0</strong> resultados
            </div>
            <div class="view-options">
                <button class="view-toggle active" data-view="grid" title="Vista de grilla">⊞</button>
                <button class="view-toggle" data-view="list" title="Vista de lista">☰</button>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid" id="contentGrid"></div>

        <!-- Content List -->
        <div class="content-list" id="contentList" style="display: none;"></div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-title">No se encontraron resultados</div>
            <p>Intenta con otros filtros o palabras clave</p>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="contentModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="parser-telegram.js"></script>
    <script src="academy-app.js"></script>
</body>
</html>
